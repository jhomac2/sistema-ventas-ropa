<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Ventas · Local de Ropa</title>
<style>
:root{
  --bg:#f4f2ee; --surface:#ffffff; --surface-2:#faf9f6; --ink:#1c1f26; --ink-2:#464b56; --muted:#767b85;
  --line:#e3e0d8; --line-2:#efece6;
  --navy:#1e2a3f; --navy-2:#2b3a55; --accent:#b8553a; --accent-h:#a34a31; --accent-soft:#f6e4dc;
  --ok:#1d7a46; --ok-soft:#e2f2e8; --warn:#8a5a00; --warn-soft:#fbf0d9; --bad:#b42318; --bad-soft:#fde7e4;
  --series:#2a78d6;
  --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(20,24,33,.05),0 4px 14px rgba(20,24,33,.04);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-2);cursor:pointer;text-decoration:underline}
h1,h2,h3{margin:0 0 .35em;line-height:1.2;letter-spacing:-.01em}
h1{font-size:24px}h2{font-size:19px}h3{font-size:15px}
p{margin:0 0 .6em}
.muted{color:var(--muted)}.small{font-size:12px}.b{font-weight:650}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.neg{color:var(--bad)}.pos{color:var(--ok)}

/* ===== estructura ===== */
.shell{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
.side{background:var(--navy);color:#dfe5ef;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.brand-name{font-weight:650;color:#fff;font-size:14px;line-height:1.2;word-break:break-word}
.brand-sub{font-size:11px;color:#9aa6ba}
.nav{display:flex;flex-direction:column;padding:6px 8px;gap:2px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:transparent;color:#c9d2e0;border-radius:8px;cursor:pointer;text-align:left;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;line-height:18px}
.side-foot{padding:12px 16px;font-size:11px;color:#8794aa;border-top:1px solid rgba(255,255,255,.08)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;min-height:58px}
.top-title{font-size:18px;font-weight:650}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.user-chip{display:flex;flex-direction:column;line-height:1.15;text-align:right;padding:0 4px}
.user-chip small{color:var(--muted);font-size:11px}
#content{padding:20px 24px 48px;width:100%;max-width:1480px}
.banner{margin:12px 24px 0;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:12px;justify-content:space-between;font-size:13px;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:#5c3d00;border:1px solid #efd9a6}
.banner.bad{background:var(--bad-soft);color:#7a1a12;border:1px solid #f4c4be}

/* ===== piezas ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-head h3{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:560;white-space:nowrap;transition:background .12s,border-color .12s;text-decoration:none}
.btn:hover{background:var(--surface-2);border-color:#d0ccc2}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2);border-color:var(--navy-2)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn-danger{color:var(--bad);border-color:#efc2bc}
.btn-danger:hover{background:var(--bad-soft)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:rgba(0,0,0,.05);border-color:transparent}
.btn-sm{height:28px;padding:0 10px;font-size:12.5px}
.btn-xl{height:52px;font-size:16px;width:100%;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
kbd{font-family:inherit;font-size:11px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)}
.scanbox kbd,.light kbd{background:var(--line-2);border-color:var(--line);color:var(--muted)}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:560}
input,select,textarea{height:38px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;font-size:14px;color:var(--ink);font-weight:400;outline:none;transition:border-color .12s,box-shadow .12s;min-width:0}
textarea{height:auto;padding:9px 11px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
input:focus,select:focus,textarea:focus{border-color:#7d8fb3;box-shadow:0 0 0 3px rgba(42,75,141,.13)}
input[type=checkbox]{height:16px;width:16px;accent-color:var(--navy)}
input[readonly]{background:var(--surface-2);color:var(--muted)}
.check{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink);cursor:pointer}
.form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.form-row>label{flex:1;min-width:140px}
.form-row>label.grow{flex:2.5}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.w-s{width:72px}.w-m{width:120px}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 8px}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.note.warn{background:var(--warn-soft);border-color:#efd9a6;color:#5c3d00}
.note.bad{background:var(--bad-soft);border-color:#f4c4be;color:#7a1a12}
.note.ok{background:var(--ok-soft);border-color:#bfe3cc;color:#14532d}
.seg{display:inline-flex;background:var(--line-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:560}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg-sm{flex-wrap:nowrap}.seg-sm button{padding:4px 9px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill svg{width:12px;height:12px}
.periodo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty-state{max-width:520px;margin:40px auto;text-align:center;padding:32px}

table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
.t td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t th.num,.t td.num{text-align:right}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:#faf7f1}
.t tr.off td{color:var(--muted);text-decoration:line-through}
.t tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0;background:var(--surface-2)}
.t input,.t select{height:32px;padding:0 8px;font-size:13px}
.t .acts{display:flex;gap:4px;justify-content:flex-end}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:620px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile-l{font-size:12px;color:var(--muted);font-weight:560}
.tile-v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.01em}
.tile-s{font-size:12px;color:var(--muted)}
.tile.hero .tile-v{font-size:30px}

/* ===== vender ===== */
.posgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.scanbox{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--navy);border-radius:12px;padding:0 14px;height:56px}
.scanbox svg{width:20px;height:20px;color:var(--muted);flex:none}
.scanbox input{border:0;box-shadow:none!important;height:50px;font-size:17px;flex:1;padding:0;min-width:0;width:100%}
.res-head{margin:14px 2px 8px}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.prod{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:112px;transition:border-color .12s,transform .12s}
.prod:hover{border-color:var(--navy);transform:translateY(-1px)}
.prod-cat{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.prod-name{font-weight:600;font-size:14px;line-height:1.25}
.prod-code{font-size:11.5px;color:var(--muted)}
.prod-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.prod-price{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.prod-stock{font-size:12px;color:var(--muted)}.prod-stock.low{color:var(--warn);font-weight:650}
.prod.out{opacity:.5}
.pos-cart{position:sticky;top:76px;display:flex;flex-direction:column;max-height:calc(100vh - 92px)}
.cart-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cart-head h3{margin:0;flex:1}
.cart-items{overflow:auto;flex:1;min-height:110px}
.cart-item{display:grid;grid-template-columns:minmax(0,1fr) auto 72px 24px;gap:8px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line-2)}
.ci-name{font-weight:600;font-size:13.5px;line-height:1.25}
.ci-sub{font-size:11.5px;color:var(--muted)}
.ci-total{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.cart-empty{padding:30px 16px;text-align:center;color:var(--muted)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{width:28px;height:30px;border:0;background:var(--surface-2);cursor:pointer;font-size:16px;line-height:1}
.qty button:hover{background:var(--line-2)}
.qty input{width:36px;height:30px;border:0;border-radius:0;text-align:center;padding:0;box-shadow:none!important}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;width:26px;height:26px;border-radius:6px;padding:0}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.cart-foot{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:0 0 var(--r) var(--r)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.pagos{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
.pagos button{padding:7px 4px;font-size:12.5px}
.cambio{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:560}
.cambio b{height:38px;display:flex;align-items:center;font-size:18px;font-variant-numeric:tabular-nums;color:var(--ink)}
.cambio b.falta{color:var(--bad);font-size:14px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.totals .tr{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);padding:1px 0;font-variant-numeric:tabular-nums}
.totals .tr.big{font-size:24px;font-weight:700;color:var(--ink);padding-top:6px}
.flash{animation:flash .6s}
@keyframes flash{0%{background:#fff2c9}100%{background:transparent}}

/* ===== caja ===== */
.caja-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.denoms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px}
.denom{display:grid;grid-template-columns:96px 70px 1fr;gap:8px;align-items:center;font-size:13px}
.denom input{height:34px;text-align:center}
.denom .sub{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.big-total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-size:15px}
.big-total b{font-size:24px;font-variant-numeric:tabular-nums}
.result{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.result .tile{text-align:center}

/* ===== inventario ===== */
.metodos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.metodo{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.metodo-t>b{display:block;font-size:14px}
.metodo-t span{font-size:12.5px;color:var(--muted)}
.step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;margin-right:8px;vertical-align:1px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ent-row td{padding:5px 6px}
.ent-row input{width:100%}
.ent-row .c-cod{min-width:120px}.ent-row .c-nom{min-width:190px}.ent-row .c-cat{min-width:120px}.ent-row .c-n{width:84px}
.st{font-size:11.5px;font-weight:600;white-space:nowrap}
.st.new{color:var(--series)}.st.old{color:var(--ok)}.st.err{color:var(--bad)}.st.warn{color:var(--warn)}
.sum-line{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:10px 0}
.sum-line b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ===== gráficos ===== */
.vchart{position:relative}
.vbars{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:190px;border-bottom:1px solid var(--line);padding-top:6px}
.vbar{flex:1 1 0;max-width:64px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:4px;cursor:default;padding:0 1px}
.vbar i{display:block;background:var(--series);border-radius:4px 4px 0 0;min-height:0}
.vbar:hover i{background:#1f63b8}
.vbar.zero i{height:0!important}
.vlabels{display:flex;justify-content:center;gap:2px;font-size:10.5px;color:var(--muted);margin-top:4px}
.vlabels span{flex:1 1 0;max-width:64px;text-align:center;min-width:4px;overflow:hidden;white-space:nowrap}
.vmax{position:absolute;top:-2px;left:0;font-size:11px;color:var(--muted)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbar-track{height:10px;border-radius:4px}
.hbar-fill{height:100%;background:var(--series);border-radius:0 4px 4px 0;min-width:2px}
.hbar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.hbar-val small{font-weight:400;color:var(--muted);margin-left:4px}
#tip{position:fixed;z-index:200;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;pointer-events:none;white-space:nowrap;display:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}

/* ===== contabilidad ===== */
table.er td{padding:9px 12px;font-size:14px}
table.er tr.sub td{font-weight:650;background:var(--surface-2)}
table.er tr.total td{font-weight:750;font-size:16px;border-top:2px solid var(--ink);border-bottom:0}
.alerta{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;align-items:start}
.alerta.alta{border-color:#f0c4be;background:#fffafa}
.alerta .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.alerta.alta .ic{background:var(--bad-soft);color:var(--bad)}
.alerta.media .ic{background:var(--warn-soft);color:var(--warn)}
.alerta .ic svg{width:17px;height:17px}
.alerta h4{margin:0 0 2px;font-size:14px}
.alerta p{margin:0;font-size:13px;color:var(--ink-2)}
.hash{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--muted)}

/* ===== acceso ===== */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 10% -10%,#e9e4da 0,transparent 60%),var(--bg)}
.auth{width:100%;max-width:520px;padding:30px}
.auth .brand-mark{width:46px;height:46px;font-size:18px;border-radius:12px;margin-bottom:14px}
.auth .stack{gap:12px}
.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:8px 0 6px}
.user-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.user-btn:hover{border-color:var(--navy)}
.user-btn.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,42,63,.12)}
.user-btn .av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.user-btn small{color:var(--muted);font-size:11.5px}
.credit{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
.file-link{position:relative;display:inline-block;color:var(--navy-2);text-decoration:underline;cursor:pointer;font-size:13px}
.file-link input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

/* ===== ventanas ===== */
.overlay{position:fixed;inset:0;background:rgba(20,24,33,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto;animation:fade .12s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:pop .14s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:.6}to{transform:none;opacity:1}}
.modal.wide{max-width:860px}.modal.xwide{max-width:1120px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16px}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:13px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:560}
#toast-root{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:300;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .2s;max-width:90vw}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* ===== ticket ===== */
.ticket{width:72mm;margin:0 auto;font-family:ui-monospace,"Courier New",monospace;font-size:12px;color:#000;background:#fff;padding:10px 8px;line-height:1.35}
.t-c{text-align:center}.t-b{font-weight:700}.t-big{font-size:14px}.t-s{font-size:10px}
.t-sep{border-top:1px dashed #000;margin:6px 0}
.t-row{display:flex;justify-content:space-between;gap:8px}
.ticket-preview{background:#e9e6df;padding:16px;border-radius:10px;max-height:58vh;overflow:auto}
#print-area{display:none}

@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{display:block;position:absolute;left:0;top:0}
  @page{margin:3mm}
}
@media (max-width:1180px){.posgrid{grid-template-columns:minmax(0,1fr) 350px}.metodos{grid-template-columns:1fr}.grid-main{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .prod-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}
  .top{padding:10px 16px}
  .banner{margin:10px 16px 0}
  .side{position:static;height:auto}
  .nav{flex-direction:row;overflow:auto}
  .nav button span{display:none}
  .side-foot{display:none}
  .posgrid{grid-template-columns:minmax(0,1fr)}
  .pos-cart{position:static;max-height:none}
  .grid2,.denoms,.result{grid-template-columns:1fr}
  #content{padding:16px}
}

<body>
<div id="app"><div class="empty">Cargando…</div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
'use strict';
/* =====================================================================
   SISTEMA DE CONTROL DE VENTAS Y CONTABILIDAD — LOCAL DE ROPA
   Una sola página, funciona sin internet. Diseñado por Jhordy Cabascango.
   Reglas: nada se borra · todo tiene dueño · números seguidos ·
           funciones separadas · conteo de caja a ciegas.
   ===================================================================== */

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(((Number(n)||0)+Number.EPSILON)*100)/100;
const r4=n=>Math.round(((Number(n)||0)+Number.EPSILON)*10000)/10000;
const money=n=>{n=r2(n);return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
const fmtPct=n=>(Math.round((Number(n)||0)*10)/10).toLocaleString('es-EC')+'%';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowISO=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>{d=new Date(d);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const hhmm=d=>{d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes());};
const fd=d=>{d=new Date(d);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;};
const fdt=d=>fd(d)+' '+hhmm(d);
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const sum=(a,f)=>r2(a.reduce((s,x)=>s+(Number(f(x))||0),0));
const initials=s=>String(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function parseNum(s){
  if(typeof s==='number')return s;
  s=String(s??'').trim().replace(/\s|\$/g,'');
  if(!s)return NaN;
  const c=s.lastIndexOf(','),p=s.lastIndexOf('.');
  if(c>-1&&p>-1){ if(c>p)s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(c>-1)s=s.replace(',','.');
  const n=Number(s);return isFinite(n)?n:NaN;
}
function download(name,text,mime='text/plain'){
  const b=new Blob([text],{type:mime});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
}
function csvCell(v){ if(typeof v==='number')v=String(r4(v)).replace('.',','); v=String(v??''); return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCSV(name,header,rows){ download(name,'﻿'+[header,...rows].map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8'); }
function parseDelimited(text){
  text=String(text||'').replace(/^﻿/,'');
  let lines=text.split(/\r?\n/);
  if(/^sep=/i.test(lines[0]||''))lines=lines.slice(1);
  const first=lines.find(l=>l.trim())||'';
  const d=first.includes('\t')?'\t':((first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',');
  const rows=[];
  for(const line of lines){
    if(!line.trim())continue;
    const out=[];let cur='',q=false;
    for(let i=0;i<line.length;i++){const ch=line[i];
      if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else if(ch==='"')q=true; else if(ch===d){out.push(cur);cur='';} else cur+=ch; }
    out.push(cur);rows.push(out.map(x=>x.trim()));
  }
  return rows;
}

/* ---------- huella digital SHA-256 (para detectar cambios) ---------- */
const SHA_K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(str){const msg=new TextEncoder().encode(str),l=msg.length,len=((l+9+63)>>6)<<6,buf=new Uint8Array(len);buf.set(msg);buf[l]=0x80;const dv=new DataView(buf.buffer),bits=l*8;dv.setUint32(len-4,bits>>>0);dv.setUint32(len-8,Math.floor(bits/4294967296));const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);const w=new Uint32Array(64);for(let o=0;o<len;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const x=w[i-15],y=w[i-2];const s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);const s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];for(let i=0;i<64;i++){const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));const ch=(e&f)^(~e&g);const t1=(h+S1+ch+SHA_K[i]+w[i])|0;const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));const mj=(a&b)^(a&c)^(b&c);const t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}H[0]+=a;H[1]+=b;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h;}return Array.from(H,x=>x.toString(16).padStart(8,'0')).join('');}

/* ---------- íconos ---------- */
const IC={
  vender:'<path d="M6 7h12l-1.2 13H7.2L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
  caja:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14.5" r="1.6"/>',
  ventas:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/>',
  inventario:'<path d="M12 6.5a2 2 0 1 1 2 2c-1 .3-2 1-2 2v.8"/><path d="M12 11.3l-9 6.2h18l-9-6.2z"/>',
  contabilidad:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5v-15z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/><path d="M9 7.5h6M9 11h4"/>',
  reportes:'<path d="M4 20V11M10 20V5M16 20v-7M2 20h20"/>',
  auditoria:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>',
  config:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  buscar:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>',
  alerta:'<path d="M12 4l9 16H3L12 4z"/><path d="M12 10v4M12 17v.5"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/>',
  ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'
};
const svg=(k,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]||''}</svg>`;

/* ---------- catálogos ---------- */
const PAGO={efectivo:'Efectivo',transferencia:'Transferencia',tarjeta:'Tarjeta',fiado:'Fiado'};
const PAGO_COMPRA={caja:'Pagado con dinero de la caja',otro:'Pagado por banco u otro medio',credito:'A crédito (queda por pagar)'};
const GASTO_CATS=['Arriendo','Luz y agua','Internet y teléfono','Sueldos','Transporte','Publicidad','Limpieza y mantenimiento','Bolsas y empaques','Impuestos y permisos','Comida','Otros'];
const AJ_SALIDA=['Dañado','Perdido o robado','Devuelto al proveedor','Regalo o muestra','Error de registro'];
const AJ_ENTRADA=['Encontrado (sobrante)','Error de registro'];
const DEV_MOTIVOS=['No le quedó','No le gustó','Falla o defecto','Cambio por otra prenda','Otro'];
const CATS_BASE=['Camisas','Camisetas','Blusas','Pantalones','Jeans','Vestidos','Faldas','Shorts','Chompas y buzos','Chaquetas','Ropa deportiva','Ropa interior','Pijamas','Ropa de niños','Accesorios','Zapatos'];
const DENOMS=[{k:'b100',v:100,t:'Billete $100'},{k:'b50',v:50,t:'Billete $50'},{k:'b20',v:20,t:'Billete $20'},{k:'b10',v:10,t:'Billete $10'},{k:'b5',v:5,t:'Billete $5'},{k:'b1',v:1,t:'Billete $1'},{k:'m1',v:1,t:'Moneda $1'},{k:'m50',v:.5,t:'Moneda 50¢'},{k:'m25',v:.25,t:'Moneda 25¢'},{k:'m10',v:.1,t:'Moneda 10¢'},{k:'m5',v:.05,t:'Moneda 5¢'},{k:'m1c',v:.01,t:'Moneda 1¢'}];

/* ---------- guardado (IndexedDB, y si falla, localStorage) ---------- */
const KEY='sistema_ropa_db', ANCLA='sistema_ropa_ancla';
let DB=null, useLS=false, saveChain=Promise.resolve(), saveTimer=null;
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('sistema_ropa',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  get(k){return new Promise((res,rej)=>{const q=this.db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
};
async function loadDB(){
  try{ await IDB.open(); const v=await IDB.get(KEY); if(v)return JSON.parse(v);
       const ls=localStorage.getItem(KEY); return ls?JSON.parse(ls):null; }
  catch(e){ useLS=true; const v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }
}
function leerAncla(){try{return JSON.parse(localStorage.getItem(ANCLA)||'null');}catch(e){return null;}}
function escribirAncla(force){
  try{const a=leerAncla();const last=DB.log[DB.log.length-1];
    if(force||!a||DB.log.length>=a.n)localStorage.setItem(ANCLA,JSON.stringify({n:DB.log.length,hash:last?last.hash:''}));}catch(e){}
}
function save(){
  clearTimeout(saveTimer);
  const data=JSON.stringify(DB);
  saveChain=saveChain.then(()=>useLS?localStorage.setItem(KEY,data):IDB.set(KEY,data))
    .catch(err=>{console.error(err);toast('¡No se pudo guardar! Descarga un respaldo ahora mismo.','bad');});
  escribirAncla(false);
}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,500);}
function nuevaDB(){return{v:1,creado:nowISO(),
  config:{tienda:'Mi Local de Ropa',ruc:'',direccion:'',telefono:'',pie:'¡Gracias por su compra!',iva:15,preciosConIva:true,descMax:10,horaAbre:'08:00',horaCierra:'20:00',diasParada:60,ultimoRespaldo:null},
  usuarios:[],productos:[],movInv:[],ventas:[],devoluciones:[],cajas:[],cajaMov:[],gastos:[],abonos:[],compras:[],pagosProv:[],conteos:[],precios:[],log:[],
  seq:{venta:0,devolucion:0,compra:0,codigo:0},borrador:{entrada:[],conteo:null}};}

/* ---------- estado de la pantalla ---------- */
const S={user:null,view:'vender',tabs:{inv:'productos',cont:'resumen',aud:'alertas',ventas:'ventas',cfg:'local'},
  cart:[],desc:{tipo:'%',valor:0},pago:'efectivo',recibido:'',cliente:'',q:'',
  invQ:'',invCat:'',invOff:false,periodo:{p:'hoy',desde:'',hasta:''},loginUser:null,fails:{},
  logQ:'',logU:'',movQ:'',movT:'',ventasQ:'',cntQ:'',alertasAltas:0};
const isOwner=()=>!!(S.user&&S.user.rol==='dueno');

/* ---------- bitácora con cadena de huellas ---------- */
const logPayload=e=>[e.n,e.fecha,e.uid,e.usuario,e.accion,e.detalle,e.ref,e.huella,e.prev].join('|');
function audit(accion,detalle,opt={}){
  const last=DB.log[DB.log.length-1];
  const e={n:DB.log.length+1,fecha:nowISO(),uid:S.user?S.user.id:'',usuario:opt.usuario||(S.user?S.user.nombre:'Sistema'),
    accion,detalle:String(detalle||''),ref:opt.ref||'',huella:opt.snap?sha256(opt.snap):'',prev:last?last.hash:'INICIO'};
  e.hash=sha256(logPayload(e));DB.log.push(e);return e;
}
const ventaCore=v=>JSON.stringify([v.num,v.fecha,v.uid,v.items.map(i=>[i.prodId,i.cant,i.precio,i.costo]),v.descuento,v.total,v.pago,v.cliente]);
const compraCore=c=>JSON.stringify([c.num,c.fecha,c.items.map(i=>[i.prodId,i.cant,i.costo]),c.total,c.pago]);
const gastoCore=g=>JSON.stringify([g.fecha,g.categoria,g.monto,g.fuente]);
const devCore=d=>JSON.stringify([d.num,d.ventaId,d.items.map(i=>[i.prodId,i.cant]),d.monto]);
const cierreCore=c=>JSON.stringify([c.id,c.abre.monto,c.cierre.contado,c.cierre.esperado,c.cierre.fondo]);
const verifCode=v=>{const h=sha256(ventaCore(v)).slice(0,8).toUpperCase();return h.slice(0,4)+'-'+h.slice(4);};

function verificar(){
  const P=[];let prev='INICIO';
  DB.log.forEach((e,i)=>{
    if(e.n!==i+1)P.push(`La bitácora tiene un salto cerca del registro #${i+1} (alguien borró o metió registros).`);
    if(e.prev!==prev)P.push(`El registro #${e.n} no encaja con el anterior: la cadena está rota.`);
    if(sha256(logPayload(e))!==e.hash)P.push(`El registro #${e.n} (${e.accion}) fue modificado después de guardarse.`);
    prev=e.hash;
  });
  const by={};DB.log.forEach(e=>{if(e.ref&&e.huella)by[e.accion+'|'+e.ref]=e;});
  const chk=(lista,accion,core,nombre)=>lista.forEach(x=>{const e=by[accion+'|'+x.id];
    if(!e)P.push(`${nombre(x)} no aparece en la bitácora.`); else if(e.huella!==sha256(core(x)))P.push(`${nombre(x)} fue cambiada después de registrarse.`);});
  chk(DB.ventas,'Venta',ventaCore,v=>`La venta #${v.num}`);
  chk(DB.compras,'Entrada de mercadería',compraCore,c=>`La compra #${c.num}`);
  chk(DB.gastos,'Gasto',gastoCore,g=>`El gasto "${g.descripcion}" del ${fd(g.fecha)}`);
  chk(DB.devoluciones,'Devolución',devCore,d=>`La devolución #${d.num}`);
  chk(DB.cajas.filter(c=>c.cierre),'Cierre de caja',cierreCore,c=>`El cierre de caja del ${fd(c.cierre.fecha)}`);
  const nums=new Set(DB.ventas.map(v=>v.num));
  for(let i=1;i<=DB.seq.venta;i++)if(!nums.has(i))P.push(`Falta la venta #${i}: la numeración tiene un hueco.`);
  const a=leerAncla();
  if(a&&a.n>DB.log.length)P.push(`Antes había ${a.n} registros en la bitácora y ahora hay ${DB.log.length}: se borraron registros del final.`);
  return{ok:!P.length,problemas:P,n:DB.log.length,ventas:DB.ventas.length};
}

/* ---------- consultas ---------- */
const prodById=id=>DB.productos.find(p=>p.id===id);
const prodByCode=c=>{c=String(c??'').trim().toLowerCase();return c?DB.productos.find(p=>p.codigo.toLowerCase()===c):null;};
const cajaAbierta=()=>DB.cajas.find(c=>!c.cierre)||null;
const cajaLista=()=>{const c=cajaAbierta();return c&&!c.conteo?c:null;};
const ultimaCerrada=()=>{for(let i=DB.cajas.length-1;i>=0;i--)if(DB.cajas[i].cierre)return DB.cajas[i];return null;};
const categorias=()=>[...new Set([...DB.productos.map(p=>p.categoria).filter(Boolean),...CATS_BASE])].sort((a,b)=>a.localeCompare(b));
const proveedores=()=>[...new Set(DB.compras.map(c=>c.proveedor).filter(Boolean))].sort();
function nuevoCodigo(extra=[]){let c;do{DB.seq.codigo++;c='R'+String(DB.seq.codigo).padStart(5,'0');}while(prodByCode(c)||extra.some(x=>String(x).toLowerCase()===c.toLowerCase()));return c;}
const devDeVenta=v=>DB.devoluciones.filter(d=>d.ventaId===v.id);
function devueltoDe(v){const m={};devDeVenta(v).forEach(d=>d.items.forEach(i=>m[i.idx]=(m[i.idx]||0)+i.cant));return m;}
function saldoFiado(v){if(v.pago!=='fiado'||v.estado!=='ok')return 0;
  return r2(v.total-sum(devDeVenta(v),d=>d.aCredito)-sum(DB.abonos.filter(a=>a.ventaId===v.id),a=>a.monto));}
function saldoCompra(c){if(c.pago!=='credito')return 0;return r2(c.total-sum(DB.pagosProv.filter(p=>p.compraId===c.id),p=>p.monto));}
function calcTotales(items,desc,cfg=DB.config){
  const bruto=r2(items.reduce((s,i)=>s+i.precio*i.cant,0));
  let d=desc.tipo==='%'?r2(bruto*(Number(desc.valor)||0)/100):r2(Number(desc.valor)||0);
  d=Math.min(Math.max(d,0),bruto);
  const neto=r2(bruto-d),p=(Number(cfg.iva)||0)/100;let base,iva,total;
  if(cfg.preciosConIva){total=neto;base=r2(total/(1+p));iva=r2(total-base);}else{base=neto;iva=r2(base*p);total=r2(base+iva);}
  return{bruto,descuento:d,pct:bruto?d/bruto*100:0,base,iva,total};
}
function resumenCaja(c){
  const vs=DB.ventas.filter(v=>v.cajaId===c.id&&v.estado==='ok');
  const by=m=>sum(vs.filter(v=>v.pago===m),v=>v.total);
  const r={nVentas:vs.length,nAnuladas:DB.ventas.filter(v=>v.cajaId===c.id&&v.estado==='anulada').length,
    ventasEf:by('efectivo'),ventasTr:by('transferencia'),ventasTa:by('tarjeta'),ventasFi:by('fiado'),
    devEf:sum(DB.devoluciones.filter(d=>d.cajaId===c.id),d=>d.efectivo),
    gastos:sum(DB.gastos.filter(g=>g.cajaId===c.id&&g.fuente==='caja'&&!g.anulado),g=>g.monto),
    abonos:sum(DB.abonos.filter(a=>a.cajaId===c.id&&a.medio==='efectivo'),a=>a.monto),
    ingresos:sum(DB.cajaMov.filter(m=>m.cajaId===c.id&&m.tipo==='ingreso'),m=>m.monto),
    retiros:sum(DB.cajaMov.filter(m=>m.cajaId===c.id&&m.tipo==='retiro'),m=>m.monto),
    compras:sum(DB.compras.filter(x=>x.cajaId===c.id&&x.pago==='caja'),x=>x.total),
    pagosProv:sum(DB.pagosProv.filter(p=>p.cajaId===c.id&&p.fuente==='caja'),p=>p.monto)};
  r.esperado=r2(c.abre.monto+r.ventasEf+r.abonos+r.ingresos-r.devEf-r.gastos-r.retiros-r.compras-r.pagosProv);
  return r;
}
function movimientosCaja(c){
  const L=[{fecha:c.abre.fecha,tipo:'Apertura',det:`Fondo inicial · ${c.abre.usuario}`,entra:c.abre.monto,sale:0}];
  DB.ventas.filter(v=>v.cajaId===c.id).forEach(v=>L.push({fecha:v.fecha,tipo:v.estado==='anulada'?'Venta anulada':'Venta',
    det:`#${v.num} · ${PAGO[v.pago]}${v.pago!=='efectivo'?' '+money(v.total)+' (no entra a la caja)':''}${v.cliente?' · '+v.cliente:''} · ${v.usuario}`,
    entra:v.estado==='ok'&&v.pago==='efectivo'?v.total:0,sale:0,off:v.estado==='anulada'}));
  DB.devoluciones.filter(d=>d.cajaId===c.id&&d.efectivo>0).forEach(d=>L.push({fecha:d.fecha,tipo:'Devolución',det:`#${d.num} de la venta #${d.ventaNum} · ${d.usuario}`,entra:0,sale:d.efectivo}));
  DB.gastos.filter(g=>g.cajaId===c.id&&g.fuente==='caja').forEach(g=>L.push({fecha:g.fecha,tipo:g.anulado?'Gasto anulado':'Gasto',det:`${g.categoria}: ${g.descripcion} · ${g.usuario}`,entra:0,sale:g.anulado?0:g.monto,off:!!g.anulado}));
  DB.abonos.filter(a=>a.cajaId===c.id&&a.medio==='efectivo').forEach(a=>L.push({fecha:a.fecha,tipo:'Abono de fiado',det:`${a.cliente} · venta #${a.ventaNum}`,entra:a.monto,sale:0}));
  DB.cajaMov.filter(m=>m.cajaId===c.id).forEach(m=>L.push({fecha:m.fecha,tipo:m.tipo==='ingreso'?'Ingreso de dinero':'Retiro de dinero',det:`${m.motivo} · ${m.usuario}${m.autoriza&&m.autoriza!==m.usuario?' · autorizó '+m.autoriza:''}`,entra:m.tipo==='ingreso'?m.monto:0,sale:m.tipo==='retiro'?m.monto:0}));
  DB.compras.filter(x=>x.cajaId===c.id&&x.pago==='caja').forEach(x=>L.push({fecha:x.fecha,tipo:'Compra de mercadería',det:`#${x.num}${x.proveedor?' · '+x.proveedor:''}`,entra:0,sale:x.total}));
  DB.pagosProv.filter(p=>p.cajaId===c.id&&p.fuente==='caja').forEach(p=>L.push({fecha:p.fecha,tipo:'Pago a proveedor',det:`${p.proveedor} · compra #${p.compraNum}`,entra:0,sale:p.monto}));
  return L.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
}

/* ---------- periodo ---------- */
function rango(){
  const P=S.periodo,n=new Date(),y=n.getFullYear(),m=n.getMonth(),hoy=new Date(y,m,n.getDate());
  const add=(d,k)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+k);
  const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
  switch(P.p){
    case 'ayer':return[add(hoy,-1),hoy];
    case 'semana':{const s=add(hoy,-((hoy.getDay()+6)%7));return[s,add(s,7)];}
    case 'mes':return[new Date(y,m,1),new Date(y,m+1,1)];
    case 'mespasado':return[new Date(y,m-1,1),new Date(y,m,1)];
    case 'anio':return[new Date(y,0,1),new Date(y+1,0,1)];
    case 'todo':return[new Date(2000,0,1),add(hoy,1)];
    case 'rango':{const a=P.desde?pd(P.desde):hoy;const b=P.hasta?add(pd(P.hasta),1):add(hoy,1);return[a,b>a?b:add(a,1)];}
    default:return[hoy,add(hoy,1)];
  }
}
const inR=(iso,R)=>{const t=new Date(iso);return t>=R[0]&&t<R[1];};
function rangoLabel(){const[a,b]=rango();const b1=new Date(b-1);if(S.periodo.p==='todo')return 'Todo el historial';return dayKey(a)===dayKey(b1)?fd(a):`${fd(a)} al ${fd(b1)}`;}
function periodoBar(){
  const P=S.periodo;
  const ops=[['hoy','Hoy'],['ayer','Ayer'],['semana','Esta semana'],['mes','Este mes'],['mespasado','Mes pasado'],['anio','Este año'],['todo','Todo'],['rango','Elegir fechas']];
  return `<div class="periodo"><div class="seg">${ops.map(([k,l])=>`<button data-act="periodo" data-p="${k}" class="${P.p===k?'on':''}">${l}</button>`).join('')}</div>
  ${P.p==='rango'?`<div class="inline"><input type="date" value="${P.desde}" data-chg="perDesde"> <span class="muted">a</span> <input type="date" value="${P.hasta}" data-chg="perHasta"></div>`:''}
  <span class="muted small">${rangoLabel()}</span></div>`;
}

/* ---------- operaciones (lógica del negocio) ---------- */
function movInv(p,cant,tipo,detalle,ref,motivo){
  const m={id:uid(),fecha:nowISO(),prodId:p.id,codigo:p.codigo,nombre:p.nombre,tipo,cant,stock:p.stock,costo:p.costo,detalle:detalle||'',ref:ref||'',motivo:motivo||'',usuario:S.user?S.user.nombre:''};
  DB.movInv.push(m);return m;
}
function cambiarPrecio(p,nuevo,motivo){
  DB.precios.push({id:uid(),fecha:nowISO(),prodId:p.id,campo:'precio',antes:p.precio,despues:nuevo,motivo:motivo||'',usuario:S.user.nombre});
  audit('Cambio de precio',`${p.codigo} · ${p.nombre}: ${money(p.precio)} → ${money(nuevo)}${motivo?' · '+motivo:''}`,{ref:p.id});
  p.precio=nuevo;
}
function registrarVenta({recibido,cambio,autoriza}){
  const c=cajaLista();if(!c)throw new Error('La caja no está abierta');
  for(const it of S.cart){const p=prodById(it.prodId);if(!p||p.stock<it.cant)throw new Error(`No hay suficiente stock de "${p?p.nombre:'?'}". El sistema dice que hay ${p?p.stock:0}.`);}
  const items=S.cart.map(it=>{const p=prodById(it.prodId);return{prodId:p.id,codigo:p.codigo,nombre:p.nombre,categoria:p.categoria,cant:it.cant,precio:p.precio,costo:p.costo};});
  const t=calcTotales(items,S.desc);
  DB.seq.venta++;
  const v={id:uid(),num:DB.seq.venta,fecha:nowISO(),uid:S.user.id,usuario:S.user.nombre,items,bruto:t.bruto,descuento:t.descuento,descPct:r2(t.pct),
    base:t.base,iva:t.iva,ivaPct:DB.config.iva,conIva:DB.config.preciosConIva,total:t.total,pago:S.pago,recibido:r2(recibido),cambio:r2(cambio),
    cliente:S.cliente.trim(),cajaId:c.id,estado:'ok',autoriza:autoriza?autoriza.nombre:''};
  v.verif=verifCode(v);
  items.forEach(it=>{const p=prodById(it.prodId);p.stock-=it.cant;movInv(p,-it.cant,'venta','Venta #'+v.num,v.id);});
  DB.ventas.push(v);
  audit('Venta',`Venta #${v.num} por ${money(v.total)} · ${PAGO[v.pago]}${v.descuento?` · descuento ${money(v.descuento)} (${fmtPct(v.descPct)})`:''}${v.autoriza?' · autorizó '+v.autoriza:''}${v.cliente?' · cliente: '+v.cliente:''}`,{ref:v.id,snap:ventaCore(v)});
  return v;
}
function anularVenta(v,motivo,au){
  const c=cajaLista();
  if(v.estado!=='ok')throw new Error('Esta venta ya está anulada');
  if(!c||v.cajaId!==c.id)throw new Error('Solo se anulan ventas de la caja abierta de hoy. Para ventas anteriores usa Devolución.');
  if(devDeVenta(v).length)throw new Error('Esta venta ya tiene devoluciones, no se puede anular');
  if(DB.abonos.some(a=>a.ventaId===v.id))throw new Error('Esta venta fiada ya tiene abonos, no se puede anular');
  v.estado='anulada';v.anulacion={fecha:nowISO(),solicitaId:S.user.id,solicita:S.user.nombre,autoriza:au.nombre,motivo};
  v.items.forEach(it=>{const p=prodById(it.prodId);if(p){p.stock+=it.cant;movInv(p,it.cant,'anulacion',`Anulación de la venta #${v.num}`,v.id,motivo);}});
  audit('Anulación',`Venta #${v.num} anulada (${money(v.total)}) · pidió ${S.user.nombre} · autorizó ${au.nombre} · motivo: ${motivo}`,{ref:v.id});
}
function registrarDevolucion(v,sel,motivo,medio,reingresa,au){
  const factor=v.bruto?v.total/v.bruto:0,c=cajaLista();
  let monto=0,costo=0;const items=[];
  sel.forEach(s=>{const it=v.items[s.idx];monto+=it.precio*s.cant*factor;if(reingresa)costo+=it.costo*s.cant;
    items.push({idx:s.idx,prodId:it.prodId,codigo:it.codigo,nombre:it.nombre,cant:s.cant,precio:r2(it.precio*factor),costo:it.costo});});
  monto=r2(monto);costo=r2(costo);
  const base=v.total?r2(monto*v.base/v.total):0,iva=r2(monto-base);
  let efectivo=0,aCredito=0,otro=0;
  if(medio==='fiado'){aCredito=Math.min(monto,saldoFiado(v));efectivo=r2(monto-aCredito);if(efectivo>0&&!c)throw new Error(`Hay que devolver ${money(efectivo)} en efectivo y la caja no está abierta.`);}
  else if(medio==='efectivo'){if(!c)throw new Error('La caja no está abierta para devolver efectivo');efectivo=monto;}
  else otro=monto;
  DB.seq.devolucion++;
  const d={id:uid(),num:DB.seq.devolucion,fecha:nowISO(),ventaId:v.id,ventaNum:v.num,items,monto,base,iva,costo,efectivo,aCredito,otro,motivo,reingresa,
    uid:S.user.id,usuario:S.user.nombre,autoriza:au.nombre,cajaId:c?c.id:''};
  items.forEach(i=>{const p=prodById(i.prodId);if(!p)return;
    if(reingresa){p.stock+=i.cant;movInv(p,i.cant,'devolucion',`Devolución #${d.num} (venta #${v.num})`,d.id,motivo);}
    else movInv(p,0,'devolucion',`Devolución #${d.num}: ${i.cant} prenda(s) dañada(s), no regresan al inventario`,d.id,motivo);});
  DB.devoluciones.push(d);
  const como=[efectivo?`${money(efectivo)} en efectivo`:'',aCredito?`${money(aCredito)} menos en la deuda`:'',otro?`${money(otro)} por transferencia/tarjeta`:''].filter(Boolean).join(' + ');
  audit('Devolución',`Devolución #${d.num} de la venta #${v.num}: ${money(monto)} (${como}) · ${motivo} · autorizó ${au.nombre}`,{ref:d.id,snap:devCore(d)});
  return d;
}
function abrirCaja(monto,nota){
  if(cajaAbierta())throw new Error('Ya hay una caja abierta');
  if(!(monto>=0))throw new Error('Escribe el dinero inicial (puede ser 0)');
  const prev=ultimaCerrada(),fondoPrev=prev?prev.cierre.fondo:null,dif=fondoPrev!=null&&Math.abs(fondoPrev-monto)>0.009;
  if(dif&&!nota)throw new Error(`El cierre anterior dejó ${money(fondoPrev)}. Si empiezas con otra cantidad, explica por qué en la nota.`);
  const c={id:uid(),abre:{fecha:nowISO(),uid:S.user.id,usuario:S.user.nombre,monto:r2(monto),nota,fondoPrev,dif},conteo:null,cierre:null};
  DB.cajas.push(c);
  audit('Apertura de caja',`Caja abierta con ${money(monto)}${dif?` (el cierre anterior dejó ${money(fondoPrev)})`:''}${nota?' · '+nota:''}`,{ref:c.id});
  return c;
}
function guardarConteo(c,detalle,contado){
  if(c.conteo)throw new Error('El conteo ya fue guardado');
  c.conteo={fecha:nowISO(),uid:S.user.id,usuario:S.user.nombre,detalle,contado:r2(contado)};
  audit('Conteo de caja',`${S.user.nombre} contó ${money(contado)} sin ver lo esperado (conteo a ciegas)`,{ref:c.id});
}
function cerrarCaja(c,nota,fondo){
  const r=resumenCaja(c),contado=c.conteo.contado,dif=r2(contado-r.esperado);
  if(Math.abs(dif)>0.009&&!nota)throw new Error('Hay diferencia: explica en la nota qué pasó');
  if(!(fondo>=0)||fondo>contado+0.001)throw new Error('El dinero que se queda en caja no puede ser mayor a lo contado');
  c.cierre={fecha:nowISO(),uid:S.user.id,usuario:S.user.nombre,esperado:r.esperado,contado,diferencia:dif,nota,fondo:r2(fondo),retiro:r2(contado-fondo),resumen:r};
  const est=Math.abs(dif)<=0.009?'cuadra':dif<0?'falta '+money(-dif):'sobra '+money(dif);
  audit('Cierre de caja',`Esperado ${money(r.esperado)} · contado ${money(contado)} · ${est} · queda ${money(fondo)} para la próxima · se retira ${money(contado-fondo)}${nota?' · '+nota:''}`,{ref:c.id,snap:cierreCore(c)});
}

function anularGasto(g,motivo,au){

function movimientoCaja(tipo,monto,motivo,au){

function abonarFiado(v,monto,medio){

}
function pagarProveedor(x,monto,fuente){

function registrarEntrada(rows,{proveedor,factura,pago,actualizarPrecio}){
  const c=cajaLista();
  if(pago==='caja'&&!c)throw new Error('Para pagar con dinero de la caja, la caja debe estar abierta');
  const seq=DB.seq.compra+1,items=[],movs=[];let total=0,nuevos=0,unidades=0;
  rows.forEach(r=>{
    let p=r.prodId?prodById(r.prodId):prodByCode(r.codigo);
    const cant=Math.round(r.cant||0),costo=r4(r.costo||0);
    if(!p){
      p={id:uid(),codigo:r.codigo,nombre:r.nombre.trim(),categoria:(r.categoria||'').trim(),costo,precio:r2(r.precio),stock:0,min:isFinite(r.min)&&r.min>=0?Math.round(r.min):2,activo:true,creado:nowISO()};
      DB.productos.push(p);nuevos++;
      audit('Producto nuevo',`${p.codigo} · ${p.nombre} · ${p.categoria||'sin categoría'} · costo ${money(p.costo)} · precio ${money(p.precio)}`,{ref:p.id});
    }else{
      if(!p.activo){p.activo=true;audit('Producto reactivado',`${p.codigo} · ${p.nombre}`,{ref:p.id});}
      if(actualizarPrecio&&r.precio>0&&Math.abs(r.precio-p.precio)>0.009)cambiarPrecio(p,r2(r.precio),'Actualizado al cargar mercadería');
      if(cant>0){const nc=p.stock>0?r4((p.stock*p.costo+cant*costo)/(p.stock+cant)):costo;
        if(Math.abs(nc-p.costo)>0.00005){DB.precios.push({id:uid(),fecha:nowISO(),prodId:p.id,campo:'costo',antes:p.costo,despues:nc,motivo:'Costo promedio por nueva compra',usuario:S.user.nombre});p.costo=nc;}}
    }
    if(cant>0){p.stock+=cant;movs.push(movInv(p,cant,'entrada',`Compra #${seq}${proveedor?' · '+proveedor:''}`,'',''));
      items.push({prodId:p.id,codigo:p.codigo,nombre:p.nombre,cant,costo});total+=cant*costo;unidades+=cant;}
  });
  total=r2(total);let compra=null;
  if(items.length){
    DB.seq.compra=seq;
    compra={id:uid(),num:seq,fecha:nowISO(),proveedor,factura,items,total,unidades,pago,cajaId:pago==='caja'?c.id:'',uid:S.user.id,usuario:S.user.nombre};
    DB.compras.push(compra);movs.forEach(m=>m.ref=compra.id);
    audit('Entrada de mercadería',`Compra #${seq}: ${unidades} prendas por ${money(total)} · ${PAGO_COMPRA[pago]}${proveedor?' · '+proveedor:''}${factura?' · factura '+factura:''}`,{ref:compra.id,snap:compraCore(compra)});
  }
  return{compra,nuevos,unidades,total};
}
function ajustarStock(p,cant,motivo,nota){
  if(!cant)throw new Error('Escribe la cantidad');
  if(p.stock+cant<0)throw new Error(`No puedes sacar más de lo que hay (${p.stock})`);
  if(!nota)throw new Error('Explica qué pasó en la nota');
  p.stock+=cant;movInv(p,cant,'ajuste',`Ajuste: ${motivo}`,'',nota);
  audit('Ajuste de inventario',`${p.codigo} · ${p.nombre}: ${cant>0?'+':''}${cant} (${motivo}) · valor ${money(Math.abs(cant)*p.costo)} · ${nota}`,{ref:p.id});

function estado(R){
  const vs=DB.ventas.filter(v=>v.estado==='ok'&&inR(v.fecha,R)),ds=DB.devoluciones.filter(d=>inR(d.fecha,R)),
        gs=DB.gastos.filter(g=>!g.anulado&&inR(g.fecha,R)),aj=DB.movInv.filter(m=>(m.tipo==='ajuste'||m.tipo==='conteo')&&inR(m.fecha,R));
  const E={vs,ds,gs,ventasTotal:sum(vs,v=>v.total),ventasBase:sum(vs,v=>v.base),ventasIva:sum(vs,v=>v.iva),
    costo:sum(vs,v=>v.items.reduce((s,i)=>s+i.costo*i.cant,0)),descuentos:sum(vs,v=>v.descuento),
    devTotal:sum(ds,d=>d.monto),devBase:sum(ds,d=>d.base),devIva:sum(ds,d=>d.iva),devCosto:sum(ds,d=>d.costo),
    gastos:sum(gs,g=>g.monto),ajustes:sum(aj,m=>m.cant*m.costo),gastosCat:{}};
  gs.forEach(g=>E.gastosCat[g.categoria]=r2((E.gastosCat[g.categoria]||0)+g.monto));
  E.ingresos=r2(E.ventasBase-E.devBase);E.costoNeto=r2(E.costo-E.devCosto);E.bruta=r2(E.ingresos-E.costoNeto);
  E.neta=r2(E.bruta-E.gastos+E.ajustes);E.ivaNeto=r2(E.ventasIva-E.devIva);E.margen=E.ingresos?E.bruta/E.ingresos*100:0;
  E.unidades=vs.reduce((s,v)=>s+v.items.reduce((a,i)=>a+i.cant,0),0)-ds.reduce((s,d)=>s+d.items.reduce((a,i)=>a+i.cant,0),0);
  return E;
}

  if(SB.length)add('media','Sobrantes de caja',`${SB.length} cierre(s) con dinero de más (${SB.map(c=>fd(c.cierre.fecha)+': '+money(c.cierre.diferencia)).join(', ')}). Un sobrante puede ser una venta que no se registró.`);
  DB.cajas.filter(c=>c.abre.dif&&inR(c.abre.fecha,R)).forEach(c=>add('media','La caja empezó con otro monto',`${fdt(c.abre.fecha)}: el cierre anterior dejó ${money(c.abre.fondoPrev)} y se abrió con ${money(c.abre.monto)} (${c.abre.usuario}). Nota: ${c.abre.nota}`));
  const aj=DB.movInv.filter(m=>m.tipo==='ajuste'&&m.cant<0&&inR(m.fecha,R));
  if(aj.length){const val=aj.reduce((s,m)=>s+(-m.cant)*m.costo,0);if(aj.length>=5||val>=50)add('media','Muchas prendas sacadas por ajuste',`${aj.length} ajuste(s) de salida por ${money(val)} a precio de costo. Revisa los motivos.`);}
  const fuera=vs.filter(v=>{const h=hhmm(v.fecha);return h<cfg.horaAbre||h>cfg.horaCierra;});
  if(fuera.length)add('media','Ventas fuera del horario',`${fuera.length} venta(s) antes de las ${cfg.horaAbre} o después de las ${cfg.horaCierra}: ${fuera.slice(0,6).map(v=>'#'+v.num+' ('+hhmm(v.fecha)+')').join(', ')}${fuera.length>6?'…':''}`);
  const PP={};DB.precios.filter(x=>x.campo==='precio').forEach(x=>(PP[x.prodId]||(PP[x.prodId]=[])).push(x));
  Object.entries(PP).forEach(([pid,L])=>{L.sort((a,b)=>a.fecha<b.fecha?-1:1);for(let i=0;i<L.length-1;i++){const a=L[i],b=L[i+1];
    if(a.despues<a.antes&&b.despues>b.antes&&new Date(b.fecha)-new Date(a.fecha)<=48*3600e3&&inR(b.fecha,R)){
      const ve=DB.ventas.filter(v=>v.estado==='ok'&&v.fecha>=a.fecha&&v.fecha<=b.fecha&&v.items.some(i=>i.prodId===pid));
      if(ve.length){const p=prodById(pid);add('alta',`El precio de "${p?p.nombre:'?'}" bajó, se vendió y volvió a subir`,`Bajó de ${money(a.antes)} a ${money(a.despues)} (${a.usuario}, ${fdt(a.fecha)}), se vendió en ${ve.map(v=>'#'+v.num).join(', ')} y volvió a ${money(b.despues)} (${b.usuario}, ${fdt(b.fecha)}). Es un truco común para quedarse con la diferencia.`);}}}});
  const DU={};DB.devoluciones.filter(d=>inR(d.fecha,R)).forEach(d=>DU[d.usuario]=(DU[d.usuario]||0)+1);
  Object.entries(DU).forEach(([u,n])=>{if(n>=3)add('media',`Muchas devoluciones · ${u}`,`${n} devoluciones en el período.`);});
  const pins=DB.log.filter(e=>e.accion==='PIN incorrecto'&&inR(e.fecha,R));

  const ver=verificar();if(!ver.ok)add('alta','Los registros fueron alterados',`${ver.problemas.length} problema(s) encontrados. Abre la pestaña Integridad para ver el detalle.`);
  return A.sort((a,b)=>(a.nivel==='alta'?0:1)-(b.nivel==='alta'?0:1));
}

function openModal({title,body,foot='',size='',onClose}){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal ${size}" role="dialog" aria-modal="true"><div class="modal-head"><h3>${title}</h3><button class="x" data-close aria-label="Cerrar">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div>`;

function closeModal(ov){

function modalForm({title,body,okText='Guardar',okClass='btn-primary',size='',onOk,onMount,cancelText='Cancelar',noEnter}){
  const ov=openModal({title,body,size,foot:`<button class="btn" data-close>${cancelText}</button><button class="btn ${okClass}" data-ok>${okText}</button>`});
  const ok=async()=>{const b=ov.querySelector('[data-ok]');if(b.disabled)return;b.disabled=true;
    try{const r=await onOk(ov);if(r!==false)closeModal(ov);}catch(err){console.error(err);toast(err.message||String(err),'bad');}
    finally{if(ov.isConnected)b.disabled=false;}};
  ov.querySelector('[data-ok]').addEventListener('click',ok);

  return `<div class="auth-wrap"><div class="auth card"><div class="brand-mark">R</div><h1>Bienvenido</h1>
  <p class="muted">Vamos a dejar listo el sistema de tu local de ropa. Toma un minuto.</p>
  <div class="stack"><label>Nombre del local<input id="su-tienda" placeholder="Ej: Boutique Andrea" autofocus></label>
  <label>Tu nombre (dueño)<input id="su-nombre" placeholder="Ej: Andrea Pérez"></label>
  <div class="row2"><label>Crea tu PIN (4 a 6 números)<input id="su-pin" type="password" inputmode="numeric" maxlength="6"></label><label>Repite el PIN<input id="su-pin2" type="password" inputmode="numeric" maxlength="6" data-enter="setup"></label></div>
  <div class="row2"><label>IVA (%)<input id="su-iva" value="15" inputmode="decimal"></label><label>¿Tus precios ya incluyen IVA?<select id="su-coniva"><option value="1">Sí, el precio ya tiene IVA</option><option value="0">No, el IVA se suma al cobrar</option></select></label></div>
  <p class="hint">Revisa que el porcentaje de IVA sea el vigente. Si tu negocio no cobra IVA, pon 0. Puedes cambiarlo después.</p>
  <button class="btn btn-primary btn-xl" data-act="setup">Empezar</button>
  <p class="small muted">Los datos se guardan en esta computadora, dentro de este navegador. Saca respaldos seguido.</p>
  <div class="small">¿Ya tienes un respaldo de otra computadora? <span class="file-link">Cárgalo aquí<input type="file" accept=".json" data-chg="restaurarInicio"></span></div></div>
  <div class="credit">Diseñado por Jhordy Cabascango</div></div></div>`;
}
function viewLogin(){
  const us=DB.usuarios.filter(u=>u.activo);
  if(!S.loginUser&&us.length===1)S.loginUser=us[0].id;
  const sel=us.find(u=>u.id===S.loginUser);
  return `<div class="auth-wrap"><div class="auth card"><div class="brand-mark">${esc(initials(DB.config.tienda))}</div><h1>${esc(DB.config.tienda)}</h1>
  <p class="muted">¿Quién va a trabajar?</p>
  <div class="user-grid">${us.map(u=>`<button class="user-btn ${u.id===S.loginUser?'on':''}" data-act="pickUser" data-id="${u.id}"><span class="av">${esc(initials(u.nombre))}</span><b>${esc(u.nombre)}</b><small>${u.rol==='dueno'?'Dueño':'Vendedor'}</small></button>`).join('')}</div>
  ${sel?`<div class="stack"><label>PIN de ${esc(sel.nombre)}<input id="lg-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" data-enter="login"></label><button class="btn btn-primary btn-xl" data-act="login">Entrar</button></div>`:''}
  <div class="credit">Diseñado por Jhordy Cabascango</div></div></div>`;
}

/* ---------- VENDER ---------- */
VIEWS.vender={title:'Vender',
  html(){
    const c=cajaAbierta();
    if(!c)return `<div class="card empty-state">${svg('caja','')}<h2>La caja está cerrada</h2><p class="muted">Para vender, primero abre la caja con el dinero con el que empiezas.</p><button class="btn btn-primary" data-act="irA" data-v="caja">Abrir caja</button></div>`;
    if(c.conteo)return `<div class="card empty-state"><h2>La caja está en cierre</h2><p class="muted">Ya se contó el dinero. Termina el cierre para seguir.</p><button class="btn btn-primary" data-act="irA" data-v="caja">Ir a Caja</button></div>`;
    return `<div class="posgrid"><section><div class="scanbox">${svg('buscar')}<input id="pos-q" autocomplete="off" placeholder="Escanea el código o escribe el nombre de la prenda" value="${esc(S.q)}"><kbd>Enter</kbd></div><div id="pos-results"></div></section><aside class="pos-cart card" id="pos-cart"></aside></div>`;
  },
  mount(){const q=$('#pos-q');if(!q)return;renderResults();renderCart();q.focus();
    q.addEventListener('input',()=>{S.q=q.value;renderResults();});
    q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();posEnter();}});}
};
function popularidad(){const m={},lim=new Date(Date.now()-30*864e5).toISOString();for(const v of DB.ventas){if(v.estado!=='ok'||v.fecha<lim)continue;for(const i of v.items)m[i.prodId]=(m[i.prodId]||0)+i.cant;}return m;}
const enCarrito=id=>{const c=S.cart.find(x=>x.prodId===id);return c?c.cant:0;};
function posMatches(q){const n=norm(q.trim());if(!n)return[];return DB.productos.filter(p=>p.activo&&(norm(p.codigo).includes(n)||norm(p.nombre).includes(n)||norm(p.categoria).includes(n)));}
function renderResults(){
  const el=$('#pos-results');if(!el)return;
  if(!DB.productos.some(p=>p.activo)){el.innerHTML=`<div class="card empty" style="margin-top:14px">Todavía no hay prendas en el inventario. ${isOwner()?'Ve a <a data-act="irInvCargar">Inventario → Cargar mercadería</a>.':'Pide al dueño que cargue el inventario.'}</div>`;return;}
  const q=S.q.trim();let list;
  if(!q){const pop=popularidad();list=DB.productos.filter(p=>p.activo).sort((a,b)=>(pop[b.id]||0)-(pop[a.id]||0)||a.nombre.localeCompare(b.nombre)).slice(0,30);}
  else list=posMatches(q).slice(0,60);
  el.innerHTML=`<div class="res-head muted small">${q?`${list.length} resultado(s) para “${esc(q)}”`:'Las más vendidas · toca una prenda para agregarla'}</div>
  <div class="prod-grid">${list.map(p=>{const left=p.stock-enCarrito(p.id);return `<button class="prod ${left<=0?'out':''}" data-act="addProd" data-id="${p.id}"><span class="prod-cat">${esc(p.categoria||'Sin categoría')}</span><span class="prod-name">${esc(p.nombre)}</span><span class="prod-code">${esc(p.codigo)}</span><span class="prod-foot"><span class="prod-price">${money(p.precio)}</span><span class="prod-stock ${left<=p.min?'low':''}">${left<=0?'Agotado':'Quedan '+left}</span></span></button>`;}).join('')||'<div class="muted" style="padding:10px">No encontré prendas con ese nombre o código.</div>'}</div>`;
}
function posEnter(){
  const q=S.q.trim();if(!q)return;
  const exact=prodByCode(q);
  if(exact&&exact.activo){addToCart(exact);}
  else{const m=posMatches(q);if(m.length===1)addToCart(m[0]);else{if(!m.length)toast(`No existe ninguna prenda con “${q}”`,'bad');return;}}
  S.q='';const i=$('#pos-q');if(i)i.value='';renderResults();
}
function addToCart(p){
  const it=S.cart.find(x=>x.prodId===p.id);const ya=it?it.cant:0;
  if(ya+1>p.stock){toast(p.stock<=0?`“${p.nombre}” está agotada en el sistema`:`Solo hay ${p.stock} de “${p.nombre}”`,'bad');return;}
  if(it)it.cant++;else S.cart.push({prodId:p.id,cant:1});
  renderCart();renderResults();
  const idx=S.cart.findIndex(x=>x.prodId===p.id);const row=$$('.cart-item')[idx];if(row){row.classList.add('flash');row.scrollIntoView({block:'nearest'});}
}
const cartItems=()=>S.cart.map(c=>{const p=prodById(c.prodId);return{precio:p.precio,cant:c.cant,costo:p.costo,p};});
function totalsHTML(t){
  const iva=DB.config.iva>0;
  return `<div class="tr"><span>Subtotal</span><span>${money(t.bruto)}</span></div>
  ${t.descuento?`<div class="tr"><span>Descuento (${fmtPct(t.pct)})</span><span>-${money(t.descuento)}</span></div>`:''}
  ${iva?`<div class="tr"><span>Base sin IVA</span><span>${money(t.base)}</span></div><div class="tr"><span>IVA ${DB.config.iva}%</span><span>${money(t.iva)}</span></div>`:''}
  <div class="tr big"><span>Total</span><span>${money(t.total)}</span></div>`;
}
function quickHTML(t){const bills=[5,10,20,50,100].filter(b=>b>t.total).slice(0,3);return `<button class="btn btn-sm" data-act="quick" data-v="${t.total}">Exacto</button>${bills.map(b=>`<button class="btn btn-sm" data-act="quick" data-v="${b}">$${b}</button>`).join('')}`;}
function renderCart(){
  const el=$('#pos-cart');if(!el)return;
  const items=cartItems(),t=calcTotales(items,S.desc),n=S.cart.reduce((s,c)=>s+c.cant,0);
  el.innerHTML=`<div class="cart-head"><h3>Venta actual</h3><span class="muted small">${n} prenda(s)</span>${S.cart.length?'<button class="btn btn-ghost btn-sm" data-act="vaciar">Vaciar</button>':''}</div>
  <div class="cart-items">${items.length?items.map((i,ix)=>`<div class="cart-item"><div><div class="ci-name">${esc(i.p.nombre)}</div><div class="ci-sub">${esc(i.p.codigo)} · ${money(i.p.precio)} c/u</div></div>
    <div class="qty"><button data-act="qty" data-i="${ix}" data-d="-1" aria-label="Menos">−</button><input value="${i.cant}" inputmode="numeric" data-chg="qtyset" data-i="${ix}" aria-label="Cantidad"><button data-act="qty" data-i="${ix}" data-d="1" aria-label="Más">+</button></div>
    <div class="ci-total">${money(i.p.precio*i.cant)}</div><button class="x" data-act="quitar" data-i="${ix}" aria-label="Quitar">×</button></div>`).join(''):'<div class="cart-empty">Escanea o toca una prenda para agregarla</div>'}</div>
  <div class="cart-foot">
    <div class="row2"><label>Descuento<div class="inline" style="flex-wrap:nowrap"><input id="desc-val" data-inp="desc" value="${S.desc.valor||''}" inputmode="decimal" placeholder="0" style="width:100%"><div class="seg seg-sm"><button data-act="descTipo" data-t="%" class="${S.desc.tipo==='%'?'on':''}">%</button><button data-act="descTipo" data-t="$" class="${S.desc.tipo==='$'?'on':''}">$</button></div></div></label>
    <label>Cliente${S.pago==='fiado'?' (obligatorio)':''}<input id="cliente" data-inp="cliente" value="${esc(S.cliente)}" placeholder="Consumidor final"></label></div>
    <div class="seg pagos">${Object.entries(PAGO).map(([k,l])=>`<button data-act="pago" data-p="${k}" class="${S.pago===k?'on':''}">${l}</button>`).join('')}</div>
    ${S.pago==='efectivo'?`<div class="row2"><label>Recibido<input id="recibido" data-inp="recibido" value="${esc(S.recibido)}" inputmode="decimal" placeholder="${t.total.toFixed(2)}"></label><div class="cambio">Cambio<b id="cambio">—</b></div></div><div class="quick" id="quick">${quickHTML(t)}</div>`:''}
    ${S.pago==='fiado'?'<div class="hint" style="margin:0">Queda como deuda del cliente. Los abonos se registran en Contabilidad → Por cobrar.</div>':''}
    <div class="totals" id="totals">${totalsHTML(t)}</div>
    <button class="btn btn-accent btn-xl" id="cobrar-btn" data-act="cobrar" ${S.cart.length?'':'disabled'}>Cobrar ${money(t.total)} <kbd>F2</kbd></button>
  </div>`;
  refreshCambio(t);
}
function refreshTotals(){const t=calcTotales(cartItems(),S.desc);const a=$('#totals');if(a)a.innerHTML=totalsHTML(t);const b=$('#cobrar-btn');if(b)b.innerHTML=`Cobrar ${money(t.total)} <kbd>F2</kbd>`;const q=$('#quick');if(q)q.innerHTML=quickHTML(t);const r=$('#recibido');if(r)r.placeholder=t.total.toFixed(2);refreshCambio(t);}
function refreshCambio(t){const el=$('#cambio');if(!el)return;t=t||calcTotales(cartItems(),S.desc);
  const rec=S.recibido===''?null:parseNum(S.recibido);
  if(rec==null||isNaN(rec)){el.textContent='—';el.className='';return;}
  if(rec>=t.total){el.textContent=money(rec-t.total);el.className='';}else{el.textContent='Falta '+money(t.total-rec);el.className='falta';}}
function mostrarTicket(v,nueva){
  openModal({title:`Venta #${v.num} ${v.estado==='anulada'?'(anulada)':''}`,size:'',
    body:`${nueva&&v.pago==='efectivo'&&v.cambio>0?`<div class="note ok" style="text-align:center;font-size:16px">Cambio a entregar: <b>${money(v.cambio)}</b></div>`:''}<div class="ticket-preview">${ticketHTML(v)}</div>`,
    foot:`<button class="btn" data-act="printVenta" data-id="${v.id}">Imprimir</button><button class="btn btn-primary" data-close autofocus>${nueva?'Nueva venta':'Cerrar'}</button>`});
}

/* ---------- CAJA ---------- */
VIEWS.caja={title:'Caja',
  html(){
    const c=cajaAbierta();let top='';
    if(!c){
      const prev=ultimaCerrada(),sug=prev?prev.cierre.fondo:null;
      top=`<div class="card pad" style="max-width:640px"><h2>Abrir caja</h2><p class="muted">Cuenta el dinero con el que empiezas y escríbelo. Todo lo que entre y salga hoy se cuadra contra este valor.</p>
      <div class="form-row"><label>Dinero inicial (fondo)<input id="ab-monto" inputmode="decimal" value="${sug!=null?sug.toFixed(2):''}" placeholder="0.00" data-enter="abrirCaja" autofocus></label><label class="grow">Nota ${sug!=null?'(obligatoria si es distinto)':'(opcional)'}<input id="ab-nota" placeholder="Ej: empiezo con sencillo" data-enter="abrirCaja"></label></div>
      ${prev?`<p class="hint">El cierre anterior (${fdt(prev.cierre.fecha)}) dejó <b>${money(prev.cierre.fondo)}</b> en caja.</p>`:''}
      <button class="btn btn-primary" data-act="abrirCaja">Abrir caja</button></div>`;
    }else{
      const r=resumenCaja(c),own=isOwner();
      top=`<div class="card pad"><div class="caja-head"><div>${c.conteo?'<span class="pill warn">Caja en cierre</span>':'<span class="pill ok">● Caja abierta</span>'}<h2 style="margin-top:8px">Desde ${fdt(c.abre.fecha)}</h2><p class="muted" style="margin:0">Abrió ${esc(c.abre.usuario)} con ${money(c.abre.monto)}${c.abre.nota?' · '+esc(c.abre.nota):''}</p></div>
      <div class="btns">${c.conteo?`<button class="btn btn-accent" data-act="cierreCaja">Terminar cierre</button>`:`<button class="btn" data-act="gastoCaja">Registrar gasto</button><button class="btn" data-act="movCaja" data-t="ingreso">Meter dinero</button><button class="btn" data-act="movCaja" data-t="retiro">Sacar dinero</button><button class="btn btn-accent" data-act="cierreCaja">Cerrar caja</button>`}</div></div>
      <div class="tiles">${tile('Ventas en efectivo',money(r.ventasEf),r.nVentas+' venta(s) en total')}${tile('Transferencias',money(r.ventasTr))}${tile('Tarjeta',money(r.ventasTa))}${tile('Fiado',money(r.ventasFi))}${tile('Gastos de la caja',money(r.gastos))}${tile('Devoluciones en efectivo',money(r.devEf))}
      ${own?tile('Efectivo que debería haber',money(r.esperado),'Solo lo ve el dueño'):''}</div>
      <h3 style="margin-top:20px">Movimientos de esta caja</h3><div class="table-wrap"><table class="t"><thead><tr><th>Hora</th><th>Qué pasó</th><th>Detalle</th><th class="num">Entra</th><th class="num">Sale</th></tr></thead><tbody>
      ${movimientosCaja(c).reverse().map(m=>`<tr class="${m.off?'off':''}"><td>${hhmm(m.fecha)}</td><td>${esc(m.tipo)}</td><td>${esc(m.det)}</td><td class="num">${m.entra?money(m.entra):''}</td><td class="num">${m.sale?money(m.sale):''}</td></tr>`).join('')}</tbody></table></div>
      ${own?'':'<p class="hint">Al cerrar, cuentas el dinero sin ver cuánto debería haber. Así el cierre es honesto para todos.</p>'}</div>`;
    }
    let hist='';
    if(isOwner()){
      const cs=DB.cajas.filter(x=>x.cierre).slice(-60).reverse();
      hist=`<div class="card pad" style="margin-top:16px"><h3>Cierres anteriores</h3>${cs.length?`<div class="table-wrap"><table class="t"><thead><tr><th>Abrió</th><th>Cerró</th><th class="num">Fondo</th><th class="num">Esperado</th><th class="num">Contado</th><th>Resultado</th><th>Nota</th><th></th></tr></thead><tbody>
      ${cs.map(x=>{const d=x.cierre.diferencia;return `<tr><td>${fdt(x.abre.fecha)}<div class="muted small">${esc(x.abre.usuario)}</div></td><td>${fdt(x.cierre.fecha)}<div class="muted small">${esc(x.cierre.usuario)}</div></td><td class="num">${money(x.abre.monto)}</td><td class="num">${money(x.cierre.esperado)}</td><td class="num">${money(x.cierre.contado)}</td><td>${Math.abs(d)<=0.009?'<span class="pill ok">Cuadra</span>':d<0?`<span class="pill bad">Falta ${money(-d)}</span>`:`<span class="pill warn">Sobra ${money(d)}</span>`}</td><td class="small">${esc(x.cierre.nota||'')}</td><td><button class="btn btn-sm" data-act="printCierre" data-id="${x.id}">Imprimir</button></td></tr>`;}).join('')}</tbody></table></div>`:'<div class="empty small">Todavía no hay cierres</div>'}</div>`;
    }
    return top+hist;
  }
};
function modalCierre(c){
  if(!c.conteo){
    const ov=modalForm({title:'Cerrar caja · Paso 1: cuenta el dinero',size:'wide',okText:'Guardar conteo',okClass:'btn-accent',
      body:`<div class="note">Cuenta los billetes y monedas que hay en la caja y escribe <b>cuántos</b> hay de cada uno. No vas a ver cuánto debería haber hasta guardar el conteo, y después <b>ya no se puede cambiar</b>.</div>
      <div class="denoms">${DENOMS.map(d=>`<div class="denom"><span>${d.t}</span><input data-den="${d.k}" inputmode="numeric" placeholder="0"><span class="sub" id="sub-${d.k}">$0.00</span></div>`).join('')}</div>
      <div class="form-row"><label>Otros valores (si los hay)<input id="den-otro" inputmode="decimal" placeholder="0.00"></label><label class="grow">Detalle de otros valores<input id="den-otro-d" placeholder="Ej: cheque"></label></div>
      <div class="big-total"><span>Total contado</span><b id="den-total">$0.00</b></div>`,
      onMount(ov){ov.addEventListener('input',()=>{let t=0;DENOMS.forEach(d=>{const n=parseInt($(`[data-den="${d.k}"]`,ov).value)||0;const s=r2(n*d.v);t+=s;$('#sub-'+d.k,ov).textContent=money(s);});const o=parseNum($('#den-otro',ov).value);if(o>0)t+=o;$('#den-total',ov).textContent=money(t);});},
      async onOk(ov){const det={};let t=0;DENOMS.forEach(d=>{const n=parseInt($(`[data-den="${d.k}"]`,ov).value)||0;if(n<0)throw new Error('Cantidad no válida');if(n){det[d.k]=n;t+=n*d.v;}});
        const o=parseNum($('#den-otro',ov).value);if(o>0){det.otro=o;det.otroDet=$('#den-otro-d',ov).value.trim();t+=o;}t=r2(t);
        if(!await confirmar(`¿Contaste bien? El total es <b>${money(t)}</b>. Después de guardar ya no se puede cambiar.`,'Sí, guardar conteo','btn-accent'))return false;
        guardarConteo(c,det,t);save();renderView();setTimeout(()=>modalCierre(c),50);}});
    return ov;
  }
  const r=resumenCaja(c),k=c.conteo,dif=r2(k.contado-r.esperado),cuadra=Math.abs(dif)<=0.009;
  modalForm({title:'Cerrar caja · Paso 2: resultado',size:'wide',okText:'Cerrar caja',okClass:'btn-accent',
    body:`<div class="result">${tile('Debería haber',money(r.esperado))}${tile('Se contó',money(k.contado),'por '+esc(k.usuario))}${tile('Diferencia',`<span class="${cuadra?'pos':dif<0?'neg':''}">${cuadra?'Cuadra':(dif<0?'Falta ':'Sobra ')+money(Math.abs(dif))}</span>`)}</div>
    <div class="table-wrap"><table class="t"><tbody>
    <tr><td>Fondo inicial</td><td class="num">${money(c.abre.monto)}</td></tr><tr><td>+ Ventas en efectivo</td><td class="num">${money(r.ventasEf)}</td></tr>
    ${r.abonos?`<tr><td>+ Abonos de fiados en efectivo</td><td class="num">${money(r.abonos)}</td></tr>`:''}${r.ingresos?`<tr><td>+ Dinero metido</td><td class="num">${money(r.ingresos)}</td></tr>`:''}
    ${r.devEf?`<tr><td>− Devoluciones en efectivo</td><td class="num">${money(r.devEf)}</td></tr>`:''}${r.gastos?`<tr><td>− Gastos de la caja</td><td class="num">${money(r.gastos)}</td></tr>`:''}
    ${r.retiros?`<tr><td>− Dinero sacado</td><td class="num">${money(r.retiros)}</td></tr>`:''}${r.compras?`<tr><td>− Compras pagadas con la caja</td><td class="num">${money(r.compras)}</td></tr>`:''}${r.pagosProv?`<tr><td>− Pagos a proveedores</td><td class="num">${money(r.pagosProv)}</td></tr>`:''}
    </tbody><tfoot><tr><td>= Debería haber</td><td class="num">${money(r.esperado)}</td></tr></tfoot></table></div>
    <p class="hint">No entran a la caja: transferencias ${money(r.ventasTr)} · tarjeta ${money(r.ventasTa)} · fiado ${money(r.ventasFi)}.</p>
    <div class="form-row"><label>¿Cuánto se queda en caja para mañana?<input id="ci-fondo" inputmode="decimal" value="${Math.min(k.contado,c.abre.monto).toFixed(2)}"></label><div class="cambio" style="flex:1">Se retira (lo guarda el dueño)<b id="ci-retiro">${money(k.contado-Math.min(k.contado,c.abre.monto))}</b></div></div>
    <label>Nota ${cuadra?'(opcional)':'(obligatoria: explica la diferencia)'}<input id="ci-nota" placeholder="${cuadra?'Todo bien':'Ej: di mal un cambio de $1'}"></label>`,
    onMount(ov){$('#ci-fondo',ov).addEventListener('input',e=>{const f=parseNum(e.target.value);$('#ci-retiro',ov).textContent=isNaN(f)?'—':money(k.contado-f);});},
    onOk(ov){const f=parseNum($('#ci-fondo',ov).value);cerrarCaja(c,$('#ci-nota',ov).value.trim(),isNaN(f)?-1:f);save();refrescarAlertas();render();
      openModal({title:'Caja cerrada',body:`<div class="note ${cuadra?'ok':dif<0?'bad':'warn'}">${cuadra?'La caja cuadró perfecto.':(dif<0?'Faltaron ':'Sobraron ')+money(Math.abs(dif))+'. Quedó registrado.'}</div><div class="ticket-preview">${cierreHTML(c)}</div>`,
        foot:`<button class="btn" data-act="printCierre" data-id="${c.id}">Imprimir cierre</button>${isOwner()?'<button class="btn" data-act="respaldo">Descargar respaldo</button>':''}<button class="btn btn-primary" data-close>Listo</button>`});}});
}

/* ---------- VENTAS (historial) ---------- */
VIEWS.ventas={title:'Ventas',
  html(){
    const own=isOwner(),c=cajaAbierta();
    let head=own?periodoBar():`<p class="hint">Ves las ventas de la caja abierta. Para devoluciones y anulaciones se necesita el PIN del dueño.</p>`;
    const tabs=tabsBar('ventas',[['ventas','Ventas'],['devoluciones','Devoluciones']]);
    if(S.tabs.ventas==='devoluciones'){
      const R=rango();const ds=(own?DB.devoluciones.filter(d=>inR(d.fecha,R)):DB.devoluciones.filter(d=>c&&d.cajaId===c.id)).slice().reverse();
      return head+tabs+`<div class="card">${ds.length?`<div class="table-wrap" style="border:0"><table class="t"><thead><tr><th>N°</th><th>Fecha</th><th>Venta</th><th>Prendas</th><th>Motivo</th><th>Cómo se devolvió</th><th>Hizo / autorizó</th><th class="num">Monto</th></tr></thead><tbody>

    }
    const R=rango();let list=own?DB.ventas.filter(v=>inR(v.fecha,R)):(c?DB.ventas.filter(v=>v.cajaId===c.id):[]);
    const q=norm(S.ventasQ.trim());if(q)list=list.filter(v=>String(v.num)===q.replace('#','')||norm(v.cliente).includes(q)||norm(v.usuario).includes(q)||v.items.some(i=>norm(i.nombre).includes(q)||norm(i.codigo)===q));
    list=list.slice().reverse();const ok=list.filter(v=>v.estado==='ok');
    return head+tabs+`<div class="sec-head"><div class="inline"><input id="ventas-q" data-inp="ventasQ" value="${esc(S.ventasQ)}" placeholder="Buscar por N°, cliente, vendedor o prenda" style="width:320px"></div>
    <div class="muted small">${ok.length} venta(s) válidas · ${money(sum(ok,v=>v.total))}</div></div>
    <div class="card">${list.length?`<div class="table-wrap" style="border:0"><table class="t"><thead><tr><th>N°</th><th>Fecha</th><th>Vendedor</th><th>Cliente</th><th class="num">Prendas</th><th>Pago</th><th class="num">Descuento</th><th class="num">Total</th><th>Estado</th></tr></thead><tbody>
    ${list.slice(0,500).map(v=>`<tr class="click ${v.estado==='anulada'?'off':''}" data-act="verVenta" data-id="${v.id}"><td><b>${v.num}</b></td><td>${fdt(v.fecha)}</td><td>${esc(v.usuario)}</td><td>${esc(v.cliente||'Consumidor final')}</td><td class="num">${v.items.reduce((s,i)=>s+i.cant,0)}</td><td>${PAGO[v.pago]}</td><td class="num">${v.descuento?money(v.descuento):''}</td><td class="num"><b>${money(v.total)}</b></td><td>${estadoPill(v)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay ventas en este período</div>'}</div>`;
  }
