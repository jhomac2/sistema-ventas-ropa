function verVenta(v){
  const dev=devueltoDe(v),ds=devDeVenta(v),c=cajaLista(),saldo=saldoFiado(v);
  const puedeAnular=v.estado==='ok'&&c&&v.cajaId===c.id&&!ds.length&&!DB.abonos.some(a=>a.ventaId===v.id);
  const puedeDev=v.estado==='ok'&&v.items.some((it,ix)=>it.cant>(dev[ix]||0));
  const ab=DB.abonos.filter(a=>a.ventaId===v.id);
  openModal({title:`Venta #${v.num}`,size:'wide',
    body:`<dl class="kv"><dt>Fecha</dt><dd>${fdt(v.fecha)}</dd><dt>Vendedor</dt><dd>${esc(v.usuario)}</dd><dt>Cliente</dt><dd>${esc(v.cliente||'Consumidor final')}</dd><dt>Pago</dt><dd>${PAGO[v.pago]}${v.pago==='efectivo'?` · recibió ${money(v.recibido)} · cambio ${money(v.cambio)}`:''}</dd><dt>Estado</dt><dd>${estadoPill(v)}</dd>${v.autoriza?`<dt>Descuento autorizado por</dt><dd>${esc(v.autoriza)}</dd>`:''}<dt>Código de verificación</dt><dd class="hash">${v.verif||verifCode(v)}</dd></dl>
    ${v.estado==='anulada'?`<div class="note bad"><b>Anulada</b> el ${fdt(v.anulacion.fecha)} · pidió ${esc(v.anulacion.solicita)} · autorizó ${esc(v.anulacion.autoriza)}<br>Motivo: ${esc(v.anulacion.motivo)}</div>`:''}
    <div class="table-wrap"><table class="t"><thead><tr><th>Prenda</th><th class="num">Cant.</th><th class="num">Precio</th><th class="num">Total</th><th class="num">Devuelto</th></tr></thead><tbody>${v.items.map((i,ix)=>`<tr><td>${esc(i.nombre)}<div class="muted small">${esc(i.codigo)}</div></td><td class="num">${i.cant}</td><td class="num">${money(i.precio)}</td><td class="num">${money(i.precio*i.cant)}</td><td class="num">${dev[ix]||''}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="3">Subtotal ${money(v.bruto)}${v.descuento?` · descuento ${money(v.descuento)}`:''}${v.iva?` · IVA ${money(v.iva)}`:''}</td><td class="num">${money(v.total)}</td><td></td></tr></tfoot></table></div>
    ${ds.length?`<h3>Devoluciones</h3>${ds.map(d=>`<div class="note">#${d.num} · ${fdt(d.fecha)} · ${money(d.monto)} · ${esc(d.motivo)} · hizo ${esc(d.usuario)}, autorizó ${esc(d.autoriza)}</div>`).join('')}`:''}
    ${v.pago==='fiado'?`<h3>Fiado</h3><p>Saldo pendiente: <b>${money(saldo)}</b></p>${ab.map(a=>`<div class="note">${fdt(a.fecha)} · abonó ${money(a.monto)} (${PAGO[a.medio]}) · recibió ${esc(a.usuario)}</div>`).join('')}`:''}
    ${v.estado==='ok'&&!puedeAnular?'<p class="hint">Solo se pueden anular ventas de la caja abierta, sin devoluciones ni abonos. Para ventas anteriores usa Devolución.</p>':''}`,
    foot:`<button class="btn" data-act="printVenta" data-id="${v.id}">Reimprimir</button>${saldo>0&&isOwner()?`<button class="btn" data-act="abonar" data-id="${v.id}">Registrar abono</button>`:''}${puedeDev?`<button class="btn" data-act="devolucion" data-id="${v.id}">Devolución</button>`:''}${puedeAnular?`<button class="btn btn-danger" data-act="anular" data-id="${v.id}">Anular venta</button>`:''}<button class="btn btn-primary" data-close>Cerrar</button>`});
}
function modalDevolucion(v){
  const factor=v.bruto?v.total/v.bruto:0,dev=devueltoDe(v),c=cajaLista(),esFiado=v.pago==='fiado';
  const lines=v.items.map((it,idx)=>({it,idx,max:it.cant-(dev[idx]||0)})).filter(l=>l.max>0);
  modalForm({title:`Devolución de la venta #${v.num}`,size:'wide',okText:'Hacer devolución',okClass:'btn-accent',
    body:`<p class="hint" style="margin:0">Escribe cuántas prendas devuelve el cliente. Para un <b>cambio</b>: primero la devolución y luego una venta nueva.</p>
    <div class="table-wrap"><table class="t"><thead><tr><th>Prenda</th><th class="num">Pagó c/u</th><th class="num">Puede devolver</th><th class="num">Devuelve</th></tr></thead><tbody>${lines.map(l=>`<tr><td>${esc(l.it.nombre)}<div class="muted small">${esc(l.it.codigo)}</div></td><td class="num">${money(l.it.precio*factor)}</td><td class="num">${l.max}</td><td class="num"><input class="w-s" data-dv="${l.idx}" data-max="${l.max}" value="${lines.length===1&&l.max===1?1:0}" inputmode="numeric"></td></tr>`).join('')}</tbody></table></div>
    <div class="form-row"><label>Motivo<select id="dv-mot">${DEV_MOTIVOS.map(m=>`<option>${m}</option>`).join('')}</select></label><label class="grow">Detalle (obligatorio)<input id="dv-det" placeholder="Explica brevemente qué pasó"></label></div>
    <label class="check"><input type="checkbox" id="dv-re" checked> La prenda regresa al inventario (está en buen estado)</label>
    ${esFiado?`<div class="note">Esta venta fue fiada: lo devuelto se descuenta de lo que debe el cliente (debe ${money(saldoFiado(v))}).</div>`:`<label>¿Cómo le devuelves el dinero?<select id="dv-medio"><option value="efectivo" ${c?'':'disabled'}>Efectivo de la caja${c?'':' (caja cerrada)'}</option><option value="otro" ${c?'':'selected'}>Transferencia o tarjeta</option></select></label>`}
    <div class="big-total"><span>A devolver</span><b id="dv-monto">$0.00</b></div>`,
    onMount(ov){const upd=()=>{let m=0;$$('[data-dv]',ov).forEach(i=>{m+=v.items[+i.dataset.dv].precio*(parseInt(i.value)||0)*factor;});$('#dv-monto',ov).textContent=money(m);};ov.addEventListener('input',upd);upd();},
    async onOk(ov){
      const sel=$$('[data-dv]',ov).map(i=>({idx:+i.dataset.dv,cant:parseInt(i.value)||0,max:+i.dataset.max})).filter(x=>x.cant!==0);
      if(!sel.length)throw new Error('Escribe cuántas prendas devuelve');
      if(sel.some(s=>s.cant<0||s.cant>s.max))throw new Error('Hay una cantidad que no es válida');
      const det=$('#dv-det',ov).value.trim();if(!det)throw new Error('Escribe el detalle de la devolución');
      const au=await pedirAutorizacion(`Devolución de la venta #${v.num}`);if(!au)return false;
      const d=registrarDevolucion(v,sel,$('#dv-mot',ov).value+' — '+det,esFiado?'fiado':$('#dv-medio',ov).value,$('#dv-re',ov).checked,au);
      save();closeAllModals();renderView();
      toast(`Devolución #${d.num} registrada: ${money(d.monto)}${d.efectivo?' · entrega '+money(d.efectivo)+' en efectivo':''}`,'ok');
    }});
}

function invProductos(){
  const own=isOwner();
  let ps=DB.productos.filter(p=>S.invOff?!p.activo:p.activo);
  const q=norm(S.invQ.trim());if(q)ps=ps.filter(p=>norm(p.codigo).includes(q)||norm(p.nombre).includes(q));
  if(S.invCat)ps=ps.filter(p=>p.categoria===S.invCat);
  ps=ps.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const act=DB.productos.filter(p=>p.activo);
  const bajo=act.filter(p=>p.stock<=p.min).length;
  return `<div class="tiles" style="margin-bottom:16px">${tile('Productos activos',act.length)}${tile('Prendas en stock',act.reduce((s,p)=>s+p.stock,0))}${own?tile('Valor a costo',money(sum(act,p=>p.stock*p.costo)),'Lo que te costó lo que hay'):''}${tile('Valor a precio de venta',money(sum(act,p=>p.stock*p.precio)))}${tile('Con stock bajo',bajo,bajo?'Hay que reponer':'')}</div>
  <div class="sec-head"><div class="inline"><input id="inv-q" data-inp="invQ" value="${esc(S.invQ)}" placeholder="Buscar por código o nombre" style="width:260px"><select data-chg="invCat"><option value="">Todas las categorías</option>${categorias().map(c=>`<option ${S.invCat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  ${own?`<label class="check"><input type="checkbox" data-chg="invOff" ${S.invOff?'checked':''}> Ver desactivados</label>`:''}</div>
  <div class="inline">${own?'<button class="btn" data-act="exportInv">Exportar a Excel</button><button class="btn btn-primary" data-act="tab" data-g="inv" data-t="cargar">+ Cargar mercadería</button>':''}</div></div>
  <div class="card">${ps.length?`<div class="table-wrap" style="border:0"><table class="t"><thead><tr><th>Código</th><th>Prenda</th><th>Categoría</th>${own?'<th class="num">Costo</th>':''}<th class="num">Precio</th>${own?'<th class="num">Margen</th>':''}<th class="num">Stock</th><th class="num">Mínimo</th>${own?'<th></th>':''}</tr></thead><tbody>
  ${ps.map(p=>{const base=DB.config.preciosConIva?p.precio/(1+DB.config.iva/100):p.precio;const mg=base?(base-p.costo)/base*100:0;return `<tr><td class="hash">${esc(p.codigo)}</td><td><b>${esc(p.nombre)}</b></td><td>${esc(p.categoria)}</td>${own?`<td class="num">${money(p.costo)}</td>`:''}<td class="num">${money(p.precio)}</td>${own?`<td class="num ${mg<0?'neg':''}">${fmtPct(mg)}</td>`:''}<td class="num">${p.stock<=p.min?`<span class="pill ${p.stock<=0?'bad':'warn'}">${p.stock}</span>`:p.stock}</td><td class="num">${p.min}</td>
  ${own?`<td><div class="acts"><button class="btn btn-sm" data-act="editProd" data-id="${p.id}">Editar</button><button class="btn btn-sm" data-act="ajusteProd" data-id="${p.id}">Ajustar</button><button class="btn btn-sm btn-ghost" data-act="kardex" data-id="${p.id}">Historial</button></div></td>`:''}</tr>`;}).join('')}</tbody></table></div>`:'<div class="empty">No hay productos que mostrar</div>'}</div>
  ${own?'<p class="hint">El stock no se cambia a mano: solo con compras, ventas, devoluciones, ajustes con motivo o conteo físico. Así cada prenda tiene su historial.</p>':''}`;
}

  <div class="metodos" style="margin-top:12px">
    <div class="metodo"><div class="metodo-t"><b>Con lector o escribiendo el código</b><span>Cada vez que escaneas, se suma la cantidad. Si el código no existe, se crea una fila nueva para que pongas nombre y precio.</span></div>
      <div class="inline" style="flex-wrap:nowrap"><input id="ent-code" placeholder="Escanea y Enter" autocomplete="off" data-enter="entScan" style="flex:1"><input id="ent-cant" class="w-s" value="1" inputmode="numeric" title="Cuántas se suman por escaneo"></div>
      <button class="btn btn-sm" data-act="entSinCodigo">+ Prenda sin código (se genera uno)</button></div>
    <div class="metodo"><div class="metodo-t"><b>Pegar desde Excel</b><span>Copia las filas en Excel y pégalas aquí (Ctrl+V). Se leen solas.<br>Columnas: <b>Código · Nombre · Categoría · Costo · Precio · Cantidad</b> · Stock mínimo (opcional). Para reponer basta <b>Código · Cantidad</b>.</span></div>
      <textarea id="ent-paste" rows="3" placeholder="Pega aquí"></textarea></div>
    <div class="metodo"><div class="metodo-t"><b>Subir archivo CSV</b><span>Usa la plantilla, llénala en Excel y guárdala como CSV.</span></div>
      <div class="inline"><span class="btn file-btn">Elegir archivo<input type="file" accept=".csv,.txt" data-chg="entFile"></span><button class="btn btn-ghost" data-act="plantilla">Descargar plantilla</button></div></div>
  </div></div>
  <div class="card pad"><div class="sec-head"><h3><span class="step">2</span>Revisa la lista <span class="muted small" style="font-weight:400">· puedes corregir aquí mismo</span></h3><button class="btn btn-sm btn-ghost" data-act="entVaciar">Vaciar lista</button></div><div id="ent-list"></div></div>
  <div class="card pad"><h3><span class="step">3</span>Datos de la compra y guardar</h3>
  <div class="form-row"><label>Proveedor<input id="ent-prov" list="dl-prov" placeholder="Ej: Distribuidora Textil"><datalist id="dl-prov">${proveedores().map(p=>`<option value="${esc(p)}">`).join('')}</datalist></label><label>N° de factura<input id="ent-fac" placeholder="Opcional"></label>
  <label>¿Cómo se pagó?<select id="ent-pago"><option value="otro">${PAGO_COMPRA.otro}</option><option value="credito">${PAGO_COMPRA.credito}</option><option value="caja" ${c?'':'disabled'}>${PAGO_COMPRA.caja}${c?'':' (caja cerrada)'}</option></select></label></div>
  <label class="check"><input type="checkbox" id="ent-upd"> Cambiar el precio de venta de las prendas que ya existen si en la lista viene otro precio</label>
  <div id="ent-sum" class="sum-line"></div>
  <button class="btn btn-primary btn-xl" data-act="entGuardar" style="max-width:380px">Guardar entrada de mercadería</button></div></div>
  <datalist id="dl-cat">${categorias().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`;
}
function entStatus(r){
  const p=r.prodId?prodById(r.prodId):null;
  if(p){if(!(r.cant>0))return['err','Falta cantidad'];return['old',`Ya existe · stock ${p.stock} → ${p.stock+r.cant}`];}
  if(!r.nombre||!r.nombre.trim())return['err','Falta nombre'];
  if(!(r.precio>0))return['err','Falta precio'];
  if(isNaN(r.costo)||r.costo<0)return['err','Costo no válido'];
  if(r.precio>0&&r.costo>r.precio)return['warn','Nuevo · precio menor al costo'];
  return['new','Nuevo'];
}
function renderEntrada(){
  const el=$('#ent-list');if(!el)return;const L=DB.borrador.entrada;
  if(!L.length){el.innerHTML='<div class="empty small">La lista está vacía. Escanea, pega desde Excel o sube un archivo.</div>';renderEntSum();return;}
  el.innerHTML=`<div class="table-wrap"><table class="t"><thead><tr><th>Código</th><th>Nombre</th><th>Categoría</th><th class="num">Costo c/u</th><th class="num">Precio venta</th><th class="num">Cantidad</th><th>Estado</th><th></th></tr></thead><tbody>
  ${L.map((r,i)=>{const p=r.prodId?prodById(r.prodId):null,[k,t]=entStatus(r);return `<tr class="ent-row" data-row="${i}"><td><input class="c-cod" value="${esc(r.codigo)}" data-ent="codigo" data-i="${i}"></td>
  <td><input class="c-nom" value="${esc(p?p.nombre:r.nombre)}" data-ent="nombre" data-i="${i}" ${p?'readonly title="Ya existe: el nombre se cambia en Editar"':''}></td>
  <td><input class="c-cat" value="${esc(p?p.categoria:r.categoria)}" data-ent="categoria" data-i="${i}" list="dl-cat" ${p?'readonly':''}></td>
  <td><input class="c-n num" value="${isNaN(r.costo)?'':r.costo}" data-ent="costo" data-i="${i}" inputmode="decimal"></td>
  <td><input class="c-n num" value="${r.precio||''}" data-ent="precio" data-i="${i}" inputmode="decimal"></td>
  <td><input class="c-n num" value="${r.cant||''}" data-ent="cant" data-i="${i}" inputmode="numeric"></td>
  <td><span class="st ${k}" id="st-${i}">${t}</span></td><td><button class="x" data-act="entQuitar" data-i="${i}" aria-label="Quitar">×</button></td></tr>`;}).join('')}</tbody></table></div>`;
  renderEntSum();
}
function renderEntSum(){const el=$('#ent-sum');if(!el)return;const L=DB.borrador.entrada;
  const un=L.reduce((s,r)=>s+(r.cant>0?r.cant:0),0),tot=L.reduce((s,r)=>s+(r.cant>0?r.cant*(r.costo||0):0),0),nu=L.filter(r=>!r.prodId).length,err=L.filter(r=>entStatus(r)[0]==='err').length;
  el.innerHTML=`<span>Filas: <b>${L.length}</b></span><span>Nuevas: <b>${nu}</b></span><span>Prendas que entran: <b>${un}</b></span><span>Total de la compra: <b>${money(tot)}</b></span>${err?`<span class="neg">Con errores: <b>${err}</b></span>`:''}`;}
function entMerge(r){
  const L=DB.borrador.entrada;
  if(!r.codigo)r.codigo=nuevoCodigo(L.map(x=>x.codigo));
  const p=prodByCode(r.codigo);
  const ex=L.find(x=>x.codigo.toLowerCase()===r.codigo.toLowerCase());
  if(ex){ex.cant=(ex.cant||0)+(r.cant||0);if(r.nombre&&!ex.prodId)ex.nombre=r.nombre;if(r.categoria&&!ex.prodId)ex.categoria=r.categoria;if(!isNaN(r.costo)&&r.costo!=null)ex.costo=r.costo;if(r.precio>0)ex.precio=r.precio;return ex;}
  const row={codigo:r.codigo,prodId:p?p.id:'',nombre:p?p.nombre:(r.nombre||''),categoria:p?p.categoria:(r.categoria||''),
    costo:(r.costo!=null&&!isNaN(r.costo))?r.costo:(p?r4(p.costo):NaN),precio:r.precio>0?r.precio:(p?p.precio:0),cant:r.cant||0,min:r.min};
  L.push(row);return row;
}
function filasDesdeTabla(rows){
  let n=0,saltadas=0;
  rows.forEach(c=>{
    if(!c.some(x=>x))return;
    if(c.length===2){const q=parseNum(c[1]);if(isNaN(q)){saltadas++;return;}entMerge({codigo:c[0],cant:Math.round(q)});n++;return;}
    const [codigo='',nombre='',categoria='',costo,precio,cant,min]=c;
    const co=parseNum(costo),pr=parseNum(precio),ca=parseNum(cant);
    if(isNaN(co)&&isNaN(pr)&&isNaN(ca)){saltadas++;return;}
    entMerge({codigo:codigo.trim(),nombre:nombre.trim(),categoria:categoria.trim(),costo:co,precio:isNaN(pr)?0:r2(pr),cant:isNaN(ca)?0:Math.round(ca),min:parseNum(min)});n++;
  });
  saveSoon();renderEntrada();

function libroDiario(R){
  const L=[];

    if(v.estado==='anulada'){L.push({fecha:v.fecha,tipo:'Venta anulada',det:`#${v.num} · ${v.anulacion.motivo}`,medio:PAGO[v.pago],entra:0,sale:0,off:true});return;}
    L.push({fecha:v.fecha,tipo:'Venta',det:`#${v.num}${v.cliente?' · '+v.cliente:''} · ${v.usuario}${v.pago==='fiado'?` · fiado ${money(v.total)} (por cobrar)`:''}`,medio:PAGO[v.pago],entra:v.pago==='fiado'?0:v.total,sale:0});});
  DB.devoluciones.filter(d=>inR(d.fecha,R)).forEach(d=>L.push({fecha:d.fecha,tipo:'Devolución',det:`#${d.num} de la venta #${d.ventaNum}${d.aCredito?` · ${money(d.aCredito)} menos en la deuda`:''}`,medio:d.efectivo?'Efectivo':d.otro?'Transferencia/tarjeta':'Fiado',entra:0,sale:r2(d.efectivo+d.otro)}));

  DB.gastos.filter(g=>inR(g.fecha,R)).forEach(g=>L.push({fecha:g.fecha,tipo:g.anulado?'Gasto anulado':'Gasto',det:`${g.categoria}: ${g.descripcion}`,medio:g.fuente==='caja'?'Efectivo (caja)':'Banco u otro',entra:0,sale:g.anulado?0:g.monto,off:!!g.anulado}));
  DB.compras.filter(x=>inR(x.fecha,R)).forEach(x=>L.push({fecha:x.fecha,tipo:'Compra de mercadería',det:`#${x.num}${x.proveedor?' · '+x.proveedor:''}${x.factura?' · fact. '+x.factura:''}${x.pago==='credito'?` · a crédito ${money(x.total)}`:''}`,medio:x.pago==='caja'?'Efectivo (caja)':x.pago==='otro'?'Banco u otro':'Crédito',entra:0,sale:x.pago==='credito'?0:x.total}));

  return L.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
}

VIEWS.auditoria={title:'Auditoría',
  html(){
    const t=S.tabs.aud,tabs=tabsBar('aud',[['alertas','Alertas'],['integridad','Integridad'],['bitacora','Bitácora'],['precios','Cambios de precio y costo']]);
    if(t==='integridad')return tabs+audIntegridad();
    if(t==='bitacora')return tabs+audBitacora();
    if(t==='precios')return tabs+audPrecios();

    return tabs+periodoBar()+`<p class="hint">El sistema revisa solo los movimientos y te avisa de lo que parece raro. Una alerta no prueba que alguien robó: es una señal para revisar.</p>
    <div class="stack" style="gap:10px">${A.length?A.map(a=>`<div class="alerta ${a.nivel}"><div class="ic">${svg(a.nivel==='alta'?'alerta':'info')}</div><div><h4>${esc(a.titulo)} <span class="pill ${a.nivel==='alta'?'bad':'warn'}">${a.nivel==='alta'?'Importante':'Revisar'}</span></h4><p>${esc(a.detalle)}</p></div></div>`).join(''):`<div class="card empty">${svg('ok')}<p style="margin-top:8px">No hay alertas en este período. Todo se ve en orden.</p></div>`}</div>`;

function audIntegridad(){
  return `<div class="grid2"><div class="card pad"><h3>¿Alguien cambió los registros?</h3>
  <p>Cada cosa que pasa en el sistema se guarda en la bitácora con una <b>huella digital</b> que depende de la anterior, como los eslabones de una cadena. Si alguien cambia, borra o mete un registro por fuera del sistema, la cadena se rompe y aquí se nota.</p>
  <p>También se revisa que cada venta, compra, gasto, devolución y cierre siga igual que cuando se guardó, y que la numeración de ventas no tenga huecos.</p>
  <button class="btn btn-primary" data-act="verificar">Verificar ahora</button></div><div id="ver-res" class="card pad"><div class="empty small">Presiona “Verificar ahora”.</div></div></div>`;
}
function audBitacora(){
  let L=DB.log;const q=norm(S.logQ.trim());
  if(S.logU)L=L.filter(e=>e.usuario===S.logU);if(q)L=L.filter(e=>norm(e.accion+' '+e.detalle).includes(q));
  L=L.slice(-800).reverse();const us=[...new Set(DB.log.map(e=>e.usuario))];
  return `<div class="sec-head"><div class="inline"><input id="log-q" data-inp="logQ" value="${esc(S.logQ)}" placeholder="Buscar en la bitácora" style="width:280px"><select data-chg="logU"><option value="">Todos los usuarios</option>${us.map(u=>`<option ${S.logU===u?'selected':''}>${esc(u)}</option>`).join('')}</select></div><div class="inline"><span class="muted small">${DB.log.length} registros en total</span><button class="btn" data-act="exportLog">Exportar a Excel</button></div></div>
  <div class="card"><div class="table-wrap" style="border:0"><table class="t"><thead><tr><th>N°</th><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th><th>Huella</th></tr></thead><tbody>
  ${L.map(e=>`<tr><td>${e.n}</td><td style="white-space:nowrap">${fdt(e.fecha)}</td><td>${esc(e.usuario)}</td><td><b>${esc(e.accion)}</b></td><td class="small">${esc(e.detalle)}</td><td class="hash" title="${e.hash}">${e.hash.slice(0,10)}</td></tr>`).join('')}</tbody></table></div></div>
  <p class="hint">La bitácora no se puede editar ni borrar desde el sistema.</p>`;
}
function audPrecios(){
  const L=DB.precios.slice().reverse();
  return `<div class="card">${L.length?`<div class="table-wrap" style="border:0"><table class="t"><thead><tr><th>Fecha</th><th>Prenda</th><th>Qué cambió</th><th class="num">Antes</th><th class="num">Después</th><th>Motivo</th><th>Usuario</th></tr></thead><tbody>
  ${L.slice(0,600).map(x=>{const p=prodById(x.prodId);return `<tr><td>${fdt(x.fecha)}</td><td>${esc(p?p.nombre:'?')}</td><td>${x.campo==='precio'?'Precio de venta':'Costo promedio'}</td><td class="num">${money(x.antes)}</td><td class="num ${x.despues<x.antes?'neg':''}">${money(x.despues)}</td><td class="small">${esc(x.motivo)}</td><td>${esc(x.usuario)}</td></tr>`;}).join('')}</tbody></table></div>`:'<div class="empty">No hay cambios de precio</div>'}</div>`;
}

const ACT={},INP={},CHG={};
const validPin=p=>/^\d{4,6}$/.test(p);
function crearUsuario(nombre,rol,pin){const salt=uid();const u={id:uid(),nombre:nombre.trim(),rol,salt,pin:hashPin(salt,pin),activo:true,creado:nowISO()};DB.usuarios.push(u);return u;}

ACT.setup=()=>{
  const tienda=$('#su-tienda').value.trim(),nombre=$('#su-nombre').value.trim(),pin=$('#su-pin').value,pin2=$('#su-pin2').value,iva=parseNum($('#su-iva').value);
  if(!tienda)return toast('Escribe el nombre del local','bad');if(!nombre)return toast('Escribe tu nombre','bad');
  if(!validPin(pin))return toast('El PIN debe tener de 4 a 6 números','bad');if(pin!==pin2)return toast('Los PIN no coinciden','bad');
  if(isNaN(iva)||iva<0||iva>50)return toast('Revisa el porcentaje de IVA','bad');
  DB.config.tienda=tienda;DB.config.iva=iva;DB.config.preciosConIva=$('#su-coniva').value==='1';
  const u=crearUsuario(nombre,'dueno',pin);
  audit('Sistema creado',`Local "${tienda}" · dueño ${nombre} · IVA ${iva}% ${DB.config.preciosConIva?'incluido en precios':'sumado al cobrar'}`,{usuario:nombre});
  S.user=u;audit('Inicio de sesión',`${u.nombre} entró al sistema`);save();S.view='inventario';S.tabs.inv='cargar';render();
  toast('¡Listo! Ahora carga tu mercadería','ok');
};
ACT.pickUser=el=>{S.loginUser=el.dataset.id;render();};
ACT.login=()=>{
  const u=DB.usuarios.find(x=>x.id===S.loginUser);if(!u)return;const inp=$('#lg-pin'),pin=inp.value;
  const f=S.fails[u.id]||(S.fails[u.id]={n:0,until:0});
  if(Date.now()<f.until)return toast(`Demasiados intentos. Espera ${Math.ceil((f.until-Date.now())/1000)} segundos`,'bad');
  if(!checkPin(u,pin)){f.n++;if(f.n>=5){f.until=Date.now()+120000;f.n=0;}audit('PIN incorrecto',`Intento fallido de entrar como ${u.nombre}`,{usuario:u.nombre});save();toast('PIN incorrecto','bad');inp.value='';inp.focus();return;}
  f.n=0;S.user=u;audit('Inicio de sesión',`${u.nombre} entró al sistema`);save();S.view='vender';refrescarAlertas();render();
};
ACT.salir=()=>{audit('Cierre de sesión',`${S.user.nombre} salió`);save();S.user=null;S.cart=[];S.loginUser=null;closeAllModals();render();};
ACT.miPin=()=>cambiarPin(S.user,true);
function cambiarPin(u,propio){
  modalForm({title:propio?'Cambiar mi PIN':`Cambiar PIN de ${esc(u.nombre)}`,okText:'Cambiar PIN',
    body:`${propio?'<label>PIN actual<input id="cp-a" type="password" inputmode="numeric" maxlength="6"></label>':''}<label>PIN nuevo (4 a 6 números)<input id="cp-n" type="password" inputmode="numeric" maxlength="6"></label><label>Repite el PIN nuevo<input id="cp-n2" type="password" inputmode="numeric" maxlength="6"></label>`,
    onOk(ov){if(propio&&!checkPin(u,$('#cp-a',ov).value)){audit('PIN incorrecto',`Intento fallido al cambiar el PIN de ${u.nombre}`);save();throw new Error('El PIN actual no es correcto');}
      const n=$('#cp-n',ov).value;if(!validPin(n))throw new Error('El PIN debe tener de 4 a 6 números');if(n!==$('#cp-n2',ov).value)throw new Error('Los PIN no coinciden');
      u.salt=uid();u.pin=hashPin(u.salt,n);audit('Cambio de PIN',propio?`${u.nombre} cambió su PIN`:`${S.user.nombre} cambió el PIN de ${u.nombre}`);save();toast('PIN cambiado','ok');}});
}

INP.cliente=el=>{S.cliente=el.value;};

ACT.cobrar=async()=>{
  if(!S.cart.length||$$('.overlay').length)return;
  if(!cajaLista())return toast('La caja no está abierta','bad');
  const items=cartItems(),t=calcTotales(items,S.desc);
  if(S.pago==='fiado'&&!S.cliente.trim()){toast('Escribe el nombre del cliente para fiar','bad');$('#cliente')&&$('#cliente').focus();return;}
  let recibido=0,cambio=0;
  if(S.pago==='efectivo'){recibido=S.recibido===''?t.total:parseNum(S.recibido);
    if(isNaN(recibido)||recibido<t.total-0.001){toast('El dinero recibido es menor que el total','bad');$('#recibido')&&$('#recibido').focus();return;}cambio=r2(recibido-t.total);}
  let au=null;const motivos=[];
  if(t.descuento>0&&t.pct>DB.config.descMax+1e-9)motivos.push(`descuento de ${fmtPct(t.pct)} (el máximo es ${DB.config.descMax}%)`);
  const costo=items.reduce((s,i)=>s+i.costo*i.cant,0);if(t.base<costo-0.005)motivos.push(`vender por debajo del costo (cobras ${money(t.base)} sin IVA y costó ${money(costo)})`);
  if(motivos.length&&!isOwner()){au=await pedirAutorizacion('Venta con '+motivos.join(' y '));if(!au)return;}
  else if(motivos.length&&isOwner()){au={id:S.user.id,nombre:S.user.nombre};}
  try{const v=registrarVenta({recibido,cambio,autoriza:au});save();
    S.cart=[];S.desc={tipo:'%',valor:0};S.cliente='';S.recibido='';S.pago='efectivo';S.q='';renderView();mostrarTicket(v,true);}
  catch(err){toast(err.message,'bad');}
};

    onOk(ov){registrarGasto({categoria:$('#gc-cat',ov).value,descripcion:$('#gc-desc',ov).value.trim(),monto:parseNum($('#gc-monto',ov).value),fuente:'caja'});save();renderView();toast('Gasto registrado','ok');}});

ACT.movCaja=el=>{

ACT.gastoAnular=el=>{const g=DB.gastos.find(x=>x.id===el.dataset.id);if(!g)return;
  modalForm({title:'Anular gasto',okText:'Anular',okClass:'btn-danger',body:`<p>${esc(g.categoria)}: ${esc(g.descripcion)} · <b>${money(g.monto)}</b></p><label>Motivo (obligatorio)<input id="ga-m" placeholder="Ej: lo registré dos veces"></label>`,
    async onOk(ov){const m=$('#ga-m',ov).value.trim();if(!m)throw new Error('Escribe el motivo');const au=await pedirAutorizacion('Anular un gasto');if(!au)return false;anularGasto(g,m,au);save();renderView();toast('Gasto anulado','ok');}});};
ACT.pagarProv=el=>{const x=DB.compras.find(c=>c.id===el.dataset.id);if(!x)return;const s=saldoCompra(x),c=cajaLista();
  modalForm({title:`Pago a ${esc(x.proveedor||'proveedor')}`,okText:'Registrar pago',body:`<p>Compra #${x.num} · debes <b>${money(s)}</b></p><label>Valor<input id="pp-m" inputmode="decimal" value="${s.toFixed(2)}"></label><label>Pagado con<select id="pp-f"><option value="otro">Banco u otro medio</option><option value="caja" ${c?'':'disabled'}>Dinero de la caja${c?'':' (cerrada)'}</option></select></label>`,
    onOk(ov){pagarProveedor(x,parseNum($('#pp-m',ov).value),$('#pp-f',ov).value);save();renderView();toast('Pago registrado','ok');}});};
ACT.verCompra=el=>{const x=DB.compras.find(c=>c.id===el.dataset.id);if(!x)return;const pg=DB.pagosProv.filter(p=>p.compraId===x.id);
  openModal({title:`Compra #${x.num}`,size:'wide',body:`<dl class="kv"><dt>Fecha</dt><dd>${fdt(x.fecha)}</dd><dt>Proveedor</dt><dd>${esc(x.proveedor||'-')}</dd><dt>Factura</dt><dd>${esc(x.factura||'-')}</dd><dt>Pago</dt><dd>${PAGO_COMPRA[x.pago]}</dd><dt>Registró</dt><dd>${esc(x.usuario)}</dd>${x.pago==='credito'?`<dt>Saldo</dt><dd>${money(saldoCompra(x))}</dd>`:''}</dl>
  <div class="table-wrap"><table class="t"><thead><tr><th>Prenda</th><th class="num">Cant.</th><th class="num">Costo c/u</th><th class="num">Total</th></tr></thead><tbody>${x.items.map(i=>`<tr><td>${esc(i.nombre)}<div class="muted small">${esc(i.codigo)}</div></td><td class="num">${i.cant}</td><td class="num">${money(i.costo)}</td><td class="num">${money(i.cant*i.costo)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Total</td><td class="num">${money(x.total)}</td></tr></tfoot></table></div>
  ${pg.map(p=>`<div class="note">${fdt(p.fecha)} · pagó ${money(p.monto)} (${p.fuente==='caja'?'caja':'banco u otro'}) · ${esc(p.usuario)}</div>`).join('')}`,foot:`${saldoCompra(x)>0?`<button class="btn" data-act="pagarProv" data-id="${x.id}">Pagar</button>`:''}<button class="btn btn-primary" data-close>Cerrar</button>`});};
ACT.exportDiario=()=>{const L=libroDiario(rango());exportCSV(`libro-diario-${dayKey(new Date())}.csv`,['Fecha','Hora','Tipo','Detalle','Forma','Entra','Sale'],L.map(x=>[fd(x.fecha),hhmm(x.fecha),x.tipo,x.det,x.medio,x.entra,x.sale]));};
ACT.exportVentas=()=>{const R=rango();const rows=[];DB.ventas.filter(v=>inR(v.fecha,R)).forEach(v=>v.items.forEach(i=>rows.push([v.num,fd(v.fecha),hhmm(v.fecha),v.usuario,v.cliente||'Consumidor final',PAGO[v.pago],v.estado==='ok'?'Válida':'Anulada',i.codigo,i.nombre,i.categoria||'',i.cant,i.precio,r2(i.precio*i.cant),v.descuento,v.total])));
  exportCSV(`ventas-${dayKey(new Date())}.csv`,['Venta','Fecha','Hora','Vendedor','Cliente','Pago','Estado','Código','Prenda','Categoría','Cant.','Precio','Subtotal','Descuento venta','Total venta'],rows);};

/* auditoría */
ACT.verificar=()=>{const r=verificar();const el=$('#ver-res');if(!el)return;
  el.innerHTML=r.ok?`<div class="note ok"><b>Todo en orden.</b> Se revisaron ${r.n} registros de la bitácora y ${r.ventas} ventas. Nadie cambió nada por fuera del sistema.</div>`:
  `<div class="note bad"><b>Se encontraron ${r.problemas.length} problema(s).</b> Alguien modificó los datos por fuera del sistema o se dañó el archivo. Compara con tu último respaldo.</div><ul>${r.problemas.slice(0,60).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;
  audit('Verificación de integridad',r.ok?`Todo en orden (${r.n} registros)`:`${r.problemas.length} problema(s) encontrados`);save();};
INP.logQ=el=>{S.logQ=el.value;rerenderKeep();};
CHG.logU=el=>{S.logU=el.value;renderView();};
ACT.exportLog=()=>exportCSV(`bitacora-${dayKey(new Date())}.csv`,['N°','Fecha','Hora','Usuario','Acción','Detalle','Huella'],DB.log.map(e=>[e.n,fd(e.fecha),hhmm(e.fecha),e.usuario,e.accion,e.detalle,e.hash]));

/* configuración */
ACT.cfgGuardar=()=>{
  const c=DB.config,n={tienda:$('#cf-tienda').value.trim()||c.tienda,ruc:$('#cf-ruc').value.trim(),telefono:$('#cf-tel').value.trim(),direccion:$('#cf-dir').value.trim(),pie:$('#cf-pie').value.trim(),
    iva:parseNum($('#cf-iva').value),preciosConIva:$('#cf-coniva').value==='1',descMax:parseNum($('#cf-desc').value),diasParada:parseInt($('#cf-par').value),horaAbre:$('#cf-abre').value||c.horaAbre,horaCierra:$('#cf-cierra').value||c.horaCierra};
  if(isNaN(n.iva)||n.iva<0||n.iva>50)return toast('Revisa el IVA','bad');if(isNaN(n.descMax)||n.descMax<0||n.descMax>100)return toast('Revisa el descuento máximo','bad');if(!(n.diasParada>0))n.diasParada=c.diasParada;
  const NM={tienda:'nombre',ruc:'RUC',telefono:'teléfono',direccion:'dirección',pie:'mensaje del ticket',iva:'IVA',preciosConIva:'precios con IVA',descMax:'descuento máximo',diasParada:'días plata parada',horaAbre:'hora de apertura',horaCierra:'hora de cierre'};
  const ch=Object.keys(n).filter(k=>n[k]!==c[k]).map(k=>`${NM[k]}: ${c[k]===true?'sí':c[k]===false?'no':c[k]} → ${n[k]===true?'sí':n[k]===false?'no':n[k]}`);
  if(!ch.length)return toast('No hay cambios');Object.assign(c,n);audit('Configuración',ch.join(' · '));save();render();toast('Configuración guardada','ok');
};
ACT.userNuevo=()=>{const nom=$('#nu-nombre').value.trim(),rol=$('#nu-rol').value,p=$('#nu-pin').value;
  if(!nom)return toast('Escribe el nombre','bad');if(DB.usuarios.some(u=>norm(u.nombre)===norm(nom)))return toast('Ya existe un usuario con ese nombre','bad');
  if(!validPin(p))return toast('El PIN debe tener de 4 a 6 números','bad');if(p!==$('#nu-pin2').value)return toast('Los PIN no coinciden','bad');
  crearUsuario(nom,rol,p);audit('Usuario nuevo',`${nom} (${rol==='dueno'?'dueño':'vendedor'})`);save();renderView();toast('Usuario agregado','ok');};
ACT.userPin=el=>{const u=DB.usuarios.find(x=>x.id===el.dataset.id);if(u)cambiarPin(u,u.id===S.user.id);};
const ownersActivos=()=>DB.usuarios.filter(u=>u.activo&&u.rol==='dueno');
ACT.userToggle=async el=>{const u=DB.usuarios.find(x=>x.id===el.dataset.id);if(!u)return;
  if(u.activo&&u.rol==='dueno'&&ownersActivos().length<=1)return toast('Debe quedar al menos un dueño activo','bad');
  if(u.id===S.user.id)return toast('No puedes desactivarte a ti mismo','bad');
  if(!await confirmar(`¿${u.activo?'Desactivar':'Activar'} a ${esc(u.nombre)}?`))return;
  u.activo=!u.activo;audit(u.activo?'Usuario activado':'Usuario desactivado',u.nombre);save();renderView();};
ACT.userRol=async el=>{const u=DB.usuarios.find(x=>x.id===el.dataset.id);if(!u)return;
  if(u.rol==='dueno'&&ownersActivos().length<=1&&u.activo)return toast('Debe quedar al menos un dueño','bad');
  const nr=u.rol==='dueno'?'vendedor':'dueno';if(!await confirmar(`¿Hacer ${nr==='dueno'?'dueño':'vendedor'} a ${esc(u.nombre)}?`))return;
  u.rol=nr;audit('Cambio de rol',`${u.nombre} ahora es ${nr==='dueno'?'dueño':'vendedor'}`);save();if(u.id===S.user.id){S.user=u;S.view='vender';render();}else renderView();};
ACT.respaldo=()=>{
  DB.config.ultimoRespaldo=nowISO();audit('Respaldo descargado',`${DB.ventas.length} ventas · ${DB.productos.length} productos · ${DB.log.length+1} registros`);
  const last=DB.log[DB.log.length-1];
  const data=JSON.stringify({tipo:'respaldo-sistema-ropa',version:1,fecha:nowISO(),tienda:DB.config.tienda,huellaFinal:last.hash,db:DB});
  const d=new Date();download(`respaldo-${norm(DB.config.tienda).replace(/[^a-z0-9]+/g,'-')}-${dayKey(d)}-${pad(d.getHours())}${pad(d.getMinutes())}.json`,data,'application/json');
  save();renderBanner();toast('Respaldo descargado. Guárdalo en una USB o en tu correo.','ok');
};
function leerRespaldo(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(o.tipo!=='respaldo-sistema-ropa'||!o.db||!Array.isArray(o.db.log))throw 0;res(o);}catch(e){rej(new Error('Ese archivo no es un respaldo de este sistema'));}};rd.onerror=()=>rej(new Error('No se pudo leer el archivo'));rd.readAsText(file);});}
CHG.restaurar=async el=>{const f=el.files[0];el.value='';if(!f)return;
  try{const o=await leerRespaldo(f);
    if(!await confirmar(`Respaldo del <b>${fdt(o.fecha)}</b> (${esc(o.tienda)}): ${o.db.ventas.length} ventas, ${o.db.productos.length} productos.<br>Esto <b>reemplaza todo</b> lo que hay ahora en esta computadora.`,'Restaurar','btn-danger'))return;
    const au=await pedirAutorizacion('Restaurar un respaldo');if(!au)return;
    const antes=DB.log.length,quien=S.user.nombre;DB=o.db;S.user=null;
    audit('Respaldo restaurado',`${quien} cargó el respaldo del ${fdt(o.fecha)} · antes había ${antes} registros, el respaldo tiene ${DB.log.length-0}`,{usuario:quien});
    save();escribirAncla(true);closeAllModals();render();toast('Respaldo restaurado. Vuelve a entrar.','ok');}
  catch(e){toast(e.message,'bad');}};
CHG.restaurarInicio=async el=>{const f=el.files[0];el.value='';if(!f)return;
  try{const o=await leerRespaldo(f);DB=o.db;audit('Respaldo restaurado',`Se cargó el respaldo del ${fdt(o.fecha)} en una computadora nueva`,{usuario:'Sistema'});save();escribirAncla(true);render();toast('Respaldo cargado. Entra con tu usuario.','ok');}
  catch(e){toast(e.message,'bad');}};
ACT.reset=()=>{
  modalForm({title:'Borrar todo y empezar de cero',okText:'Borrar todo',okClass:'btn-danger',
    body:`<div class="note bad">Se borran <b>todas</b> las ventas, productos, cajas, usuarios y la bitácora de esta computadora. Antes se descarga un respaldo.</div><label>Para confirmar escribe <b>BORRAR TODO</b><input id="rs-t" autocomplete="off"></label>`,
    async onOk(ov){if($('#rs-t',ov).value.trim().toUpperCase()!=='BORRAR TODO')throw new Error('Escribe BORRAR TODO para confirmar');
      const au=await pedirAutorizacion('Borrar todos los datos');if(!au)return false;
      ACT.respaldo();await new Promise(r=>setTimeout(r,600));DB=nuevaDB();S.user=null;S.cart=[];save();escribirAncla(true);closeAllModals();render();toast('Sistema reiniciado','ok');}});
};

/* ---------- eventos globales ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f)f(el,e);});
document.addEventListener('input',e=>{const el=e.target.closest&&e.target.closest('[data-inp]');if(el&&INP[el.dataset.inp])INP[el.dataset.inp](el,e);});
document.addEventListener('change',e=>{const el=e.target.closest&&e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el,e);});
document.addEventListener('keydown',e=>{
  const modal=$$('.overlay').length>0;
  if(e.key==='Escape'&&modal){e.preventDefault();closeModal();return;}
  if(e.key==='Enter'){const el=e.target.closest&&e.target.closest('[data-enter]');if(el){e.preventDefault();const f=ACT[el.dataset.enter];f&&f(el,e);return;}}
  if(e.key==='F2'&&S.user&&S.view==='vender'&&!modal){e.preventDefault();ACT.cobrar();return;}
  if(S.user&&S.view==='vender'&&!modal&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){const a=document.activeElement;if(!a||a===document.body||a.tagName==='BUTTON'){const q=$('#pos-q');q&&q.focus();}}
});
let lastAct=Date.now();['mousemove','keydown','click','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();},{passive:true}));
setInterval(()=>{if(S.user&&Date.now()-lastAct>15*60000){audit('Sesión cerrada',`${S.user.nombre}: cierre automático por 15 minutos sin uso`);S.user=null;S.cart=[];save();closeAllModals();render();toast('La sesión se cerró por 15 minutos sin uso');}},30000);
window.addEventListener('beforeunload',()=>{if(saveTimer){clearTimeout(saveTimer);save();}});
try{const bc=new BroadcastChannel('sistema_ropa');bc.onmessage=e=>{if(e.data==='hola')bc.postMessage('aqui');else if(e.data==='aqui'&&!window._avisoTab){window._avisoTab=1;
  openModal({title:'El sistema ya está abierto',body:'<div class="note warn">El sistema está abierto en otra pestaña o ventana. Usa <b>solo una</b> para que no se mezclen los datos. Cierra esta pestaña.</div>',foot:'<button class="btn" data-close>Entendido</button>'});}};bc.postMessage('hola');}catch(e){}

/* ---------- arranque ---------- */
(async()=>{
  try{DB=await loadDB();}catch(e){console.error(e);DB=null;}
  if(!DB)DB=nuevaDB();
  const base=nuevaDB();for(const k of Object.keys(base))if(DB[k]===undefined)DB[k]=base[k];
  DB.config=Object.assign(base.config,DB.config);DB.seq=Object.assign(base.seq,DB.seq);DB.borrador=Object.assign(base.borrador,DB.borrador||{});
  render();
})();
</script>
</body>
</html>
